<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lauriston Gardens Pixel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141a22; --fog:#2b3442; --gas:#e3a94b; --paper:#d8c9ab; --ink:#2a2018; --scarlet:#8f1d1d; --muted:#9aa3b0;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#141a22; --fog:#2b3442; --paper:#d8c9ab; --ink:#2a2018; } }
:root[data-theme="dark"]{ --night:#141a22; --paper:#d8c9ab; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--night);color:#e8e1d2;overflow:hidden;
  font-family:"Spectral",Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none}
#c{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#prompt{top:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
#chapter{background:rgba(16,20,27,.74);padding:6px 10px 7px;border-radius:4px;max-width:min(430px,56vw)}
#counter{color:#d5d9e0;line-height:1.45}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gas);outline-offset:2px}
.hidden{display:none!important}

/* HUD */
#hud-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none;z-index:5}
#chapter{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;line-height:1.2;color:#cfc6b4;text-shadow:0 1px 3px #000}
#chapter b{display:block;font-size:22px;color:var(--gas);font-weight:700}
#counter{margin-top:6px;font-size:14px;color:var(--muted)}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.tool{background:rgba(20,26,34,.78);color:#e8e1d2;border:1px solid #4a5363;border-radius:4px;padding:6px 10px;font-size:14px}
.tool[aria-pressed="true"]{border-color:var(--gas);color:var(--gas)}
.bright{display:flex;align-items:center;gap:8px}
.bright input{width:110px;accent-color:var(--gas)}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(232,225,210,.55);z-index:4;pointer-events:none}
#cross.on{background:var(--gas);box-shadow:0 0 8px var(--gas)}
#prompt{position:fixed;left:50%;top:calc(50% + 26px);transform:translateX(-50%);z-index:4;
  background:rgba(20,26,34,.82);border:1px solid var(--gas);color:#f1e6cf;padding:6px 12px;border-radius:4px;font-size:15px;white-space:nowrap}
#act{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:6;width:76px;height:76px;border-radius:50%;
  background:rgba(227,169,75,.9);color:#1d160d;border:none;font-weight:600;font-size:14px}
#stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:110px;height:110px;border-radius:50%;
  border:2px solid rgba(232,225,210,.3);z-index:4;pointer-events:none}
#stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(232,225,210,.35)}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);z-index:4;text-align:center;pointer-events:none}
#boardBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);transform:translateX(-50%);z-index:6;
  background:var(--scarlet);color:#f6ead6;border:1px solid #c45a4a;border-radius:4px;padding:10px 18px;font-size:16px}

/* Dialogue */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:min(720px,calc(100% - 28px));background:rgba(16,20,27,.93);border:1px solid #4a5363;border-left:3px solid var(--gas);
  border-radius:4px;padding:14px 18px 12px;z-index:8}
#who{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:700;color:var(--gas);margin-bottom:4px}
#line{font-size:17px;line-height:1.55;max-width:66ch}
#next{margin-top:8px;font-size:13px;color:var(--muted);text-align:right}
.en2{display:block;font-style:italic;color:#a9b1bd;font-size:.92em;margin-top:4px}

/* Overlays */
.veil{position:fixed;inset:0;z-index:10;background:rgba(10,13,18,.72);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto}
.page{background:var(--paper);color:var(--ink);width:min(640px,100%);max-height:100%;overflow:auto;border-radius:3px;
  padding:28px 30px 24px;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(transparent 0 29px, rgba(70,90,120,.16) 29px 30px);}
.page::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--scarlet);opacity:.75}
.page h1,.page h2{font-family:"Cormorant Garamond",Georgia,serif;margin:0 0 10px;line-height:1.1;color:#1f1710}
.page h1{font-size:34px}
.page h2{font-size:27px}
.page p{margin:0 0 12px;line-height:1.65;font-size:16.5px}
.page .holmes{border-top:1px solid rgba(42,32,24,.3);padding-top:10px;font-style:italic}
.page .holmes b{font-style:normal}
.page .en2{color:#5a4b3a}
.page .meta{font-size:14px;color:#6a5a47}
.btn{background:var(--ink);color:var(--paper);border:none;border-radius:3px;padding:10px 18px;font-size:16px;margin-top:6px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl{font-size:14.5px;line-height:1.6;margin:8px 0 14px;padding-left:0;list-style:none}
.ctl kbd{font-family:inherit;border:1px solid #6a5a47;border-radius:3px;padding:0 5px;background:rgba(255,255,255,.35)}
.clue-list{list-style:none;padding:0;margin:0}
.clue-list li{padding:8px 0;border-bottom:1px dashed rgba(42,32,24,.35)}
.clue-list li b{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px}
.clue-list li.missing{color:#8a7a66}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{text-align:left;background:rgba(255,255,255,.35);border:1px solid #6a5a47;border-radius:3px;padding:10px 12px;color:var(--ink);font-size:16px}
.opt:hover{background:rgba(255,255,255,.6)}
.opt.wrong{border-color:var(--scarlet);background:rgba(143,29,29,.12)}
.opt.right{border-color:#2f6b3a;background:rgba(47,107,58,.15)}
.thread{height:4px;background:var(--scarlet);border-radius:2px;transition:width .4s;margin:4px 0 14px}
.scarlet{color:var(--scarlet)}
@media (max-width:560px){ .page{padding:22px 20px 20px 30px} .page h1{font-size:28px} #chapter b{font-size:19px} #line{font-size:16px} }
@media (prefers-reduced-motion: reduce){ .thread{transition:none} }
</style>

  if (!S.dlg) return;

    const d=S.dlg.done; S.dlg=null; dialog.classList.add('hidden'); S.mode='play'; refreshHUD();
    if (d) d();

}

// ---------- Audio (rain) ----------
let actx=null, rainGain=null;
function startAudio(){
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    const len = actx.sampleRate*2, buf = actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
    rainGain=actx.createGain(); rainGain.gain.value = S.sound?0.12:0;
    src.connect(f).connect(rainGain).connect(actx.destination); src.start();
  }catch(e){}
}
$('soundBtn').onclick=e=>{ S.sound=!S.sound; if(rainGain) rainGain.gain.value=S.sound?0.12:0; refreshHUD(); e.currentTarget.blur(); };
$('journalBtn').onclick=e=>{ if(S.mode==='play'){S.mode='journal';renderJournal();} e.currentTarget.blur(); };

// ---------- Pixel engine (top-down, original pixel art drawn in code) ----------
const cv=$('c'), g=cv.getContext('2d');
const TS=16; let MW=44, MH=40, WPX=MW*TS, HPX=MH*TS;
let VW=384, VH=216, SC=3, BR=1.4;
const light=document.createElement('canvas'), lg=light.getContext('2d');
function resize(){ SC=Math.max(2,Math.floor(Math.min(innerWidth/300,innerHeight/180))); VW=Math.ceil(innerWidth/SC); VH=Math.ceil(innerHeight/SC);
  cv.width=VW; cv.height=VH; cv.style.width=VW*SC+'px'; cv.style.height=VH*SC+'px'; light.width=VW; light.height=VH; g.imageSmoothingEnabled=false; }
addEventListener('resize',resize); resize();

let seed=11; const R=()=>(seed=(seed*16807)%2147483647)/2147483647; const RI=(a,b)=>a+Math.floor(R()*(b-a+1)); const pick=a=>a[Math.floor(R()*a.length)];
const P=(c,x,y,w,h,col)=>{ c.fillStyle=col; c.fillRect(Math.round(x),Math.round(y),w,h); };
function mk(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); fn(x,w,h); return c; }
function outlined(src,col){ return mk(src.width+2,src.height+2,(x,w,h)=>{ [[0,1],[2,1],[1,0],[1,2]].forEach(([a,b])=>x.drawImage(src,a,b));
  x.globalCompositeOperation='source-in'; x.fillStyle=col||'#15131a'; x.fillRect(0,0,w,h); x.globalCompositeOperation='source-over'; x.drawImage(src,1,1); }); }
const FONT={T:'111010010010010',O:'111101101101111',L:'100100100100111',E:'111100110100111',R:'110101110101101',A:'010101111101101',C:'111100100100111',H:'101101111101101'};
function text(c,str,x,y,col,s){ s=s||1; [...str].forEach((ch,i)=>{ const b=FONT[ch]; if(!b) return; for(let j=0;j<15;j++) if(b[j]==='1') P(c,x+i*4*s+(j%3)*s,y+Math.floor(j/3)*s,s,s,col); }); }

// ---------- World state (swapped per scene) ----------
const HX0=12,HX1=31, HY0=2,HY1=15;
let solidT=[], rects=[], lights=[], litWindows=[], props=[], npcs={}, SPOT={}, bg=null;
const setSolid=(x0,y0,x1,y1,v)=>{ for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) solidT[y][x]=(v!==false); };
const addRect=(x,y,w,h)=>rects.push({x,y,w,h});
const addLight=(x,y,r,s,warm)=>{ const L={x,y,r,s,warm:warm!==false}; lights.push(L); return L; };
const addProp=(img,x,y,base)=>{ const p={img,x,y,base:base===undefined?y+img.height:base}; props.push(p); return p; };
function newWorld(mw,mh){ seed=11+mw*7; MW=mw; MH=mh; WPX=mw*TS; HPX=mh*TS; solidT=[]; for(let y=0;y<mh;y++) solidT.push(new Array(mw).fill(false)); rects=[]; lights=[]; litWindows=[]; props=[]; npcs={}; SPOT={}; }
// ---------- Background art ----------
function brick(c,x,y,w,h,base,mortar,hi){ P(c,x,y,w,h,base);
  for(let r=0;r<h;r+=4){ P(c,x,y+r+3,w,1,mortar); for(let i=((r/4)%2)*4;i<w;i+=8) P(c,x+i,y+r,1,3,mortar); }
  for(let i=0;i<w*h/60;i++) P(c,x+RI(0,w-3),y+RI(0,h/4-1)*4,RI(2,3),3,R()<.5?hi:mortar+'aa'); }

Object.assign(CLUES,{
  paper:{ t:{vi:'Tờ báo trên bàn',en:'The newspaper on the table'},
    d:{vi:'Trang nhất vẫn còn nhắc tới cuộc chiến ở Afghanistan. Tôi đã ở đó, làm bác sĩ quân y. Trong trận Maiwand, một viên đạn bắn vỡ xương vai tôi. Người lính cần vụ đã vắt tôi lên lưng ngựa thồ và đưa tôi về tuyến sau. Rồi ở bệnh viện Peshawar, bệnh thương hàn quật tôi nằm liệt nhiều tháng.',
       en:'The front page still talks of the Afghan war. I was there, as an army surgeon. At the battle of Maiwand a bullet shattered my shoulder. My orderly threw me across a pack-horse and got me back to our lines. Then, in the hospital at Peshawar, enteric fever laid me low for months.'},
    h:{vi:'Quân đội cho tôi chín tháng về Anh để hồi phục. Tôi không có người thân nào ở đây.',en:'The army gave me nine months in England to recover. I have no kith or kin here.'}, by:'Watson' },
  bill:{ t:{vi:'Hóa đơn và túi tiền',en:'The bill and my purse'},
    d:{vi:'Trợ cấp của tôi là mười một shilling sáu penny mỗi ngày. Sống trong một khách sạn ở phố Strand và tiêu pha thoải mái, tôi đã tiêu nhiều hơn mức mình có.',
       en:'My allowance is eleven shillings and sixpence a day. Living in a hotel in the Strand and spending freely, I have been spending more than I have.'},
    h:{vi:'Hoặc rời London về quê, hoặc đổi hẳn cách sống. Tôi chọn cách thứ hai: phải tìm một chỗ ở rẻ hơn.',en:'Either I leave London for the country, or I change how I live. I choose the second: I must find cheaper rooms.'}, by:'Watson' },
  bottles:{ t:{vi:'Phòng thí nghiệm hóa học',en:'The chemical laboratory'},
    d:{vi:'Một căn phòng trần cao của bệnh viện St Bartholomew, tường kín những lọ hóa chất. Trên các dãy bàn thấp, rộng là bình cổ cong, ống nghiệm và những ngọn đèn Bunsen cháy lửa xanh. Cả phòng chỉ có một người, đang cúi sát xuống chiếc bàn ở cuối.',
       en:'A lofty room in St Bartholomew\'s Hospital, lined with countless bottles. On the broad, low tables stand retorts, test-tubes and little Bunsen lamps with blue flames. There is only one man in it, bent over the far table.'},
    h:{vi:'Anh ta không học y chính quy, nhưng giỏi giải phẫu và là một nhà hóa học hạng nhất. Chẳng ai biết anh ta học để làm gì.',en:'He is not a regular medical student, yet he is well up in anatomy and a first-class chemist. Nobody knows what he is studying for.'}, by:'Stamford' },
  test:{ t:{vi:'Phép thử máu của Holmes',en:'Holmes\'s blood test'},
    d:{vi:'Holmes lấy kim chích ngón tay mình, nhỏ một giọt máu vào một lít nước. Nước vẫn trong như thường. Anh thả vào vài tinh thể trắng rồi nhỏ thêm mấy giọt chất lỏng trong suốt. Lập tức nước ngả màu gỗ gụ xỉn, và một lớp bụi nâu lắng xuống đáy bình.',
       en:'Holmes pricks his finger and lets one drop of blood fall into a litre of water. The water looks perfectly clear. He drops in a few white crystals, then some drops of a transparent fluid. At once the water turns a dull mahogany, and a brownish dust settles at the bottom of the jar.'},
    h:{vi:'Phép thử cũ vụng về và không chắc chắn. Phép thử này nhận ra máu dù vết đã cũ hay còn mới. Có nó sớm hơn thì hàng trăm kẻ đang nhởn nhơ ngoài kia đã phải đền tội.',en:'The old test was clumsy and uncertain. This one works whether the blood is old or new. Had it been invented sooner, hundreds of men now walking free would have paid for their crimes.'} },
  rooms:{ t:{vi:'Căn hộ 221B phố Baker',en:'The rooms at 221B Baker Street'},
    d:{vi:'Hai phòng ngủ dễ chịu và một phòng khách rộng, thoáng, bày biện vui mắt, sáng nhờ hai cửa sổ lớn nhìn xuống phố.',
       en:'Two comfortable bedrooms and one large, airy sitting-room, cheerfully furnished and lit by two broad windows over the street.'},
    h:{vi:'Chia đôi tiền thuê thì vừa túi tiền của tôi. Khó mà tìm được chỗ nào tốt hơn.',en:'With the rent halved, it suits my purse. I could hardly do better.'}, by:'Watson' },
  boxes:{ t:{vi:'Hòm xiểng của Holmes',en:'Holmes\'s boxes'},
    d:{vi:'Tối hôm trước tôi chuyển đồ từ khách sạn sang. Sáng nay đến lượt Holmes, với mấy cái hòm và va li. Chúng tôi mất một hai ngày dỡ đồ và sắp xếp.',
       en:'I moved my things over from the hotel last evening. This morning Holmes followed, with several boxes and portmanteaus. It takes us a day or two to unpack and settle in.'},
    h:{vi:'Vậy là xong. Từ nay tôi ở chung nhà với một người mà tôi gần như chưa biết gì.',en:'So it is done. From now on I share a home with a man I know almost nothing about.'}, by:'Watson' },
  habits:{ t:{vi:'Thói quen của Holmes',en:'Holmes\'s habits'},
    d:{vi:'Holmes là người dễ sống chung. Anh trầm lặng, giờ giấc đều đặn, hiếm khi thức quá mười giờ đêm và thường ra khỏi nhà trước khi tôi dậy. Khi hứng làm việc, không gì cản nổi sức lực của anh. Nhưng thỉnh thoảng anh nằm dài trên chiếc ghế sofa này nhiều ngày liền, hầu như không nói, không nhúc nhích.',
       en:'Holmes is easy to live with. He is quiet and regular, seldom up after ten at night, and usually out before I rise. When the working fit is on him, nothing exceeds his energy. But now and then he lies on this sofa for days on end, hardly speaking or moving.'},
    h:{vi:'Anh ta cao hơn sáu foot và gầy đến mức trông còn cao hơn. Mắt sắc, mũi khoằm như mỏ diều hâu. Bàn tay lúc nào cũng lấm mực và hóa chất.',en:'He is over six feet and so lean that he seems taller. Sharp eyes, a thin hawk-like nose. His hands are always blotted with ink and stained with chemicals.'}, by:'Watson' },
  list:{ t:{vi:'Bản danh sách của tôi',en:'My list'},
    d:{vi:'Tôi tò mò đến mức lập hẳn một danh sách “Sherlock Holmes: giới hạn hiểu biết”. Văn học, triết học, thiên văn: không biết gì. Chính trị: sơ sài. Thực vật: thất thường, nhưng rành các chất độc. Địa chất: thực dụng, nhìn vết bùn trên quần là biết dính ở khu nào của London. Hóa học: uyên thâm. Giải phẫu: chính xác. Chuyện án mạng: biết từng chi tiết của mọi vụ ghê rợn trong thế kỷ. Ngoài ra anh chơi vĩ cầm giỏi, đấu gậy, quyền Anh, kiếm đều thạo, và nắm chắc luật nước Anh.',
       en:'I am curious enough to draw up a list: "Sherlock Holmes: his limits." Literature, philosophy, astronomy: nil. Politics: feeble. Botany: variable, but well up in poisons. Geology: practical; he can tell from the splashes on his trousers which part of London they came from. Chemistry: profound. Anatomy: accurate. Sensational crime: he knows every detail of every horror of the century. He also plays the violin well, is expert at singlestick, boxing and the sword, and knows British law.'},
    h:{vi:'Anh ta còn không biết Trái Đất quay quanh Mặt Trời! Anh ta bảo bộ óc như một gác xép nhỏ: chỉ nên chứa những dụng cụ mình cần, kẻo đồ vô ích chèn mất chỗ.',en:'He did not even know that the Earth goes round the Sun! He says the brain is like a little attic: stock it only with the tools you need, or useless lumber crowds them out.'}, by:'Watson' },
  violin:{ t:{vi:'Cây vĩ cầm',en:'The violin'},
    d:{vi:'Khi tôi đề nghị, Holmes chơi những bản nhạc của Mendelssohn mà tôi yêu thích, và chơi rất hay. Còn khi ngồi một mình, anh ngả người trong ghế bành, nhắm mắt, đặt cây đàn ngang đầu gối và kéo vu vơ. Tiếng đàn lúc trầm buồn, lúc vui tươi kỳ lạ, như đi theo ý nghĩ của anh.',
       en:'When I ask, Holmes plays the Mendelssohn pieces I love, and plays them well. Left to himself, he leans back in his armchair, closes his eyes, lays the fiddle across his knee and scrapes at it. The chords are sometimes sad, sometimes strangely cheerful, as if they follow his thoughts.'},
    h:{vi:'Tôi đã định phàn nàn về mấy buổi độc tấu ấy, nhưng lần nào anh cũng kết thúc bằng một loạt bản tôi thích để đền bù.',en:'I might have complained about those solos, but he always ends with a run of my favourite airs to make up for it.'}, by:'Watson' },
  article:{ t:{vi:'Bài báo “Cuốn sách cuộc đời”',en:'The article "The Book of Life"'},
    d:{vi:'Trên bàn ăn sáng có một tờ tạp chí, một bài được đánh dấu bút chì. Bài viết cho rằng người biết quan sát có thể đọc được ý nghĩ sâu kín của kẻ khác qua một cái nhíu mày hay một cái liếc mắt. Từ một giọt nước, người giỏi suy luận có thể suy ra sự tồn tại của Đại Tây Dương hay thác Niagara dù chưa từng thấy chúng. Nhìn móng tay, ống tay áo, đôi giày, đầu gối quần, vết chai ở ngón tay là biết nghề của một người.',
       en:'On the breakfast table lies a magazine with one article marked in pencil. It claims that an observant man can read another\'s inmost thoughts from a twitch of a muscle or a glance of an eye. From a drop of water, a logician could infer an Atlantic or a Niagara without having seen either. By a man\'s finger-nails, his coat-sleeve, his boots, his trouser-knees, the callosities of his fingers, his trade is plainly revealed.'},
    h:{vi:'Toàn chuyện nhảm nhí! Chắc là của một kẻ ngồi ghế bành trong phòng kín mà bịa ra. Tôi sẵn sàng cược một ăn một nghìn rằng hắn không đoán nổi nghề của hành khách trên một toa tàu hạng ba.',en:'What ineffable twaddle! Surely the theory of some armchair lounger in his study. I would lay a thousand to one he could not name the trades of the travellers in a third-class carriage.'}, by:'Watson' },
  letter:{ t:{vi:'Thư của thanh tra Gregson',en:'Inspector Gregson\'s letter'},
    d:{vi:'“Ông Holmes thân mến, đêm qua có một chuyện chẳng lành ở số 3 Lauriston Gardens, gần đường Brixton. Khoảng hai giờ sáng, cảnh sát tuần tra thấy ánh đèn trong căn nhà bỏ trống đó. Cửa mở. Trong phòng trước, vốn không có đồ đạc gì, anh ta thấy xác một quý ông ăn mặc sang trọng, trong túi có danh thiếp ghi Enoch J. Drebber, Cleveland, Ohio, Mỹ. Không mất gì, cũng không rõ ông ta chết vì đâu. Trong phòng có vết máu, nhưng trên người không có vết thương nào. Tôi giữ nguyên hiện trường chờ ông. Tobias Gregson.”',
       en:'"My dear Mr. Holmes, there has been a bad business in the night at No. 3 Lauriston Gardens, off the Brixton Road. About two in the morning our man on the beat saw a light in that empty house. The door was open. In the front room, which has no furniture, he found the body of a well-dressed gentleman with cards in his pocket reading Enoch J. Drebber, Cleveland, Ohio, U.S.A. Nothing was taken, and nothing shows how he died. There are marks of blood in the room, yet no wound on him. I have left everything as it is until I hear from you. Tobias Gregson."'},
    h:{vi:'Gregson là người sắc sảo nhất ở Scotland Yard. Anh ta và Lestrade là hai kẻ khá nhất trong một đám kém cỏi, nhưng ghen tị nhau như hai cô đào. Lấy mũ đi, Watson.',en:'Gregson is the smartest of the Scotland Yarders. He and Lestrade are the pick of a bad lot, but as jealous of each other as a pair of professional beauties. Get your hat, Watson.'} }
});
const MSG={vi:'Người đưa thư',en:'Messenger'};
Object.assign(TALK,{
  stamford:[
    {w:'Stamford',vi:'Watson! Anh làm sao thế này? Gầy như que củi, da thì nâu như hạt dẻ.',en:'Watson! Whatever have you been doing with yourself? You are as thin as a lath and as brown as a nut.'},
    {w:'Watson',vi:'Stamford từng là phụ tá băng bó của tôi ở bệnh viện Barts. Giữa London mênh mông, gặp một gương mặt quen thật là dễ chịu. Tôi kể anh nghe mọi chuyện.',en:'Stamford had been a dresser under me at Barts. In the wilderness of London, a friendly face was a pleasant thing. I told him everything.'},
    {w:'Watson',vi:'Giờ tôi đang tìm chỗ ở: phòng tử tế mà giá phải chăng. Không biết có kiếm nổi không.',en:'Now I am looking for lodgings: comfortable rooms at a reasonable price. I wonder if it can be done.'},
    {w:'Stamford',vi:'Lạ thật. Anh là người thứ hai nói với tôi đúng câu đó trong ngày hôm nay.',en:'That\'s strange. You are the second man today to say exactly that to me.'},
    {w:'Stamford',vi:'Người kia làm việc ở phòng thí nghiệm hóa của bệnh viện. Sáng nay anh ta than không tìm được ai chia tiền thuê một căn hộ đẹp, vì một mình thì không kham nổi.',en:'The other is a fellow working in the chemical laboratory at the hospital. This morning he was bemoaning that he could find no one to go halves in some nice rooms that were too much for his purse.'},
    {w:'Watson',vi:'Nếu anh ta cần người ở chung thì tôi chính là người đó. Tôi thích có bạn hơn là ở một mình.',en:'If he wants someone to share the rooms, I am the very man. I should prefer a partner to being alone.'},
    {w:'Stamford',vi:'Anh chưa biết Sherlock Holmes đâu. Anh ta hơi kỳ quặc: mê khoa học tới mức lạnh lùng. Tôi từng thấy anh ta lấy gậy đập lên xác trong phòng mổ, chỉ để xem vết bầm hiện ra thế nào sau khi chết.',en:'You don\'t know Sherlock Holmes yet. He is a little queer: scientific to the point of cold-bloodedness. I have seen him beating the bodies in the dissecting-room with a stick, to see how far bruises appear after death.'},
    {w:'Stamford',vi:'Nhưng anh ta là người tử tế. Đi, tôi đưa anh tới gặp. Sau đó anh tự mà liệu.',en:'But he is a decent fellow. Come, I\'ll take you round to him. After that you must make your own arrangements.'}
  ],
  barman:[{w:{vi:'Người pha rượu',en:'Barman'},vi:'Quý ông dùng gì nữa không ạ? Ông bạn trẻ đằng kia hình như đang nhìn ngài đấy.',en:'Anything more for you, sir? That young gentleman over there seems to be looking your way.'}],
  labStamford:[{w:'Stamford',vi:'Anh ta kia, ở bàn cuối phòng. Cứ lại gần đi, tôi sẽ giới thiệu.',en:'There he is, at the far table. Go on over, and I\'ll introduce you.'}],
  labMeet:[
    {w:'Holmes',vi:'Tôi tìm ra rồi! Tôi tìm ra rồi! Một chất thử chỉ kết tủa với hemoglobin, và không với thứ gì khác!',en:'I\'ve found it! I\'ve found it! A reagent which is precipitated by haemoglobin, and by nothing else!'},
    {w:'Stamford',vi:'Bác sĩ Watson, đây là ông Sherlock Holmes.',en:'Dr. Watson, Mr. Sherlock Holmes.'},
    {w:'Holmes',vi:'Anh khỏe chứ? Tôi thấy anh vừa ở Afghanistan về.',en:'How are you? You have been in Afghanistan, I perceive.'},
    {w:'Watson',vi:'Làm thế quái nào anh biết được?',en:'How on earth did you know that?'},
    {w:'Holmes',vi:'Chuyện đó để sau. Bây giờ là hemoglobin. Lại đây mà xem, phát hiện này là phát hiện pháp y thực dụng nhất trong nhiều năm.',en:'Never mind that now. The question is haemoglobin. Come and see: this is the most practical medico-legal discovery for years.'}
  ],
  labBefore:[{w:'Holmes',vi:'Xem phép thử trên bàn đi đã, rồi ta nói chuyện.',en:'Look at the test on the bench first, then we shall talk.'}],
  labDeal:[
    {w:'Stamford',vi:'Chúng tôi đến có việc. Bạn tôi cần chỗ ở, còn anh thì đang tìm người chia tiền thuê.',en:'We came on business. My friend wants lodgings, and you were looking for someone to go halves.'},
    {w:'Holmes',vi:'Tôi đang để mắt tới một căn hộ ở phố Baker, hợp với hai ta vô cùng. Anh không ngại mùi thuốc lá nặng chứ?',en:'I have my eye on some rooms in Baker Street which would suit us down to the ground. You don\'t mind the smell of strong tobacco, I hope?'},
    {w:'Watson',vi:'Chính tôi cũng hút loại thuốc của thủy thủ.',en:'I always smoke ship\'s tobacco myself.'},
    {w:'Holmes',vi:'Tốt. Tôi hay bày hóa chất và làm thí nghiệm. Có lúc tôi ủ rũ, không mở miệng nhiều ngày liền. Cứ mặc tôi, rồi sẽ qua. Còn anh có gì cần thú nhận?',en:'Good. I generally have chemicals about and do experiments. I get in the dumps at times and don\'t open my mouth for days. Just let me alone and I\'ll soon be right. What have you to confess?'},
    {w:'Watson',vi:'Tôi nuôi một chú chó bull con. Thần kinh tôi còn yếu nên ghét ồn ào. Tôi dậy vào những giờ quái gở và cực kỳ lười.',en:'I keep a bull pup. My nerves are shaken, so I object to rows. I get up at all sorts of ungodly hours, and I am extremely lazy.'},
    {w:'Holmes',vi:'Anh có tính tiếng vĩ cầm là ồn ào không?',en:'Do you include violin-playing in your category of rows?'},
    {w:'Watson',vi:'Còn tùy người kéo. Kéo hay thì là món quà của thần thánh.',en:'It depends on the player. A well-played violin is a treat for the gods.'},
    {w:'Holmes',vi:'Vậy coi như xong. Trưa mai anh đến đây, ta cùng đi xem phòng.',en:'Then we may consider the thing settled. Call here at noon tomorrow, and we\'ll go together and see the rooms.'},
    {w:'Stamford',vi:'Anh sẽ thấy anh ta là một bài toán khó. Tôi cá là anh ta hiểu anh nhanh hơn anh hiểu anh ta.',en:'You\'ll find him a knotty problem. I\'ll wager he learns more about you than you about him.'}
  ],
  b1Before:[{w:'Holmes',vi:'Anh cứ xem qua một lượt đi đã: cửa sổ, và chỗ hòm xiểng của tôi kia.',en:'Take a look round first: the windows, and my boxes over there.'}],
  b1Deal:[
    {w:'Holmes',vi:'Thế nào, bác sĩ? Hai phòng ngủ, một phòng khách, tiền thuê chia đôi.',en:'Well, Doctor? Two bedrooms, one sitting-room, and the rent halved.'},
    {w:'Watson',vi:'Tôi ưng lắm. Ta nhận ngay tại chỗ chứ?',en:'It suits me very well. Shall we take it on the spot?'},
    {w:'Holmes',vi:'Nhận. Từ hôm nay, 221B phố Baker là nhà của chúng ta.',en:'Done. From today, 221B Baker Street is our home.'}
  ],
  b2Before:[{w:'Holmes',vi:'Sáng nay anh có vẻ tò mò, bác sĩ ạ. Cứ xem quanh phòng đi: tờ tạp chí trên bàn ăn chẳng hạn.',en:'You seem curious this morning, Doctor. Do look about the room: the magazine on the breakfast table, for instance.'}],
  b2Explain:[
    {w:'Holmes',vi:'Bài báo anh vừa chê là của tôi đấy.',en:'As for that article you called twaddle, I wrote it myself.'},
    {w:'Watson',vi:'Của anh!',en:'You!'},
    {w:'Holmes',vi:'Phải. Tôi có một nghề riêng, có lẽ là duy nhất trên đời: thám tử tư vấn. Ở London có rất nhiều thám tử của nhà nước và thám tử tư. Khi bí, họ tìm đến tôi, và tôi chỉ cho họ lối ra.',en:'Yes. I have a trade of my own, perhaps the only one in the world: I am a consulting detective. London has many government detectives and private ones. When they are at fault, they come to me, and I put them on the right scent.'},
    {w:'Holmes',vi:'Lestrade là một thám tử có tiếng. Gần đây anh ta rối trí vì một vụ giả mạo, nên mới tìm tới đây.',en:'Lestrade is a well-known detective. He got himself into a fog recently over a forgery case, and that was what brought him here.'},
    {w:'Watson',vi:'Vậy còn chuyện Afghanistan? Hẳn có người kể cho anh.',en:'And Afghanistan? Someone must have told you.'},
    {w:'Holmes',vi:'Không ai kể cả. Tôi nhìn là biết. Một quý ông có dáng thầy thuốc nhưng phong thái nhà binh: vậy là bác sĩ quân y.',en:'Nothing of the sort. I knew at a glance. A gentleman of the medical type, but with the air of a military man: clearly an army doctor.'},
    {w:'Holmes',vi:'Mặt sạm nắng nhưng cổ tay trắng: da sạm do vùng nhiệt đới chứ không phải bẩm sinh. Gương mặt hốc hác: từng chịu gian khổ và bệnh tật. Tay trái cử động cứng: đã bị thương.',en:'His face is dark, yet his wrists are fair: so the tan is from the tropics, not his natural tint. His haggard face says hardship and sickness. He holds his left arm stiffly: it has been injured.'},
    {w:'Holmes',vi:'Ở vùng nhiệt đới nào một bác sĩ quân y Anh vừa chịu khổ vừa bị thương ở tay? Rõ ràng là Afghanistan. Cả chuỗi suy nghĩ ấy chưa mất một giây.',en:'Where in the tropics could an English army doctor have seen such hardship and got his arm wounded? Clearly in Afghanistan. The whole train of thought did not take a second.'},
    {w:'Watson',vi:'Nghe anh giải thích thì đơn giản thật. Anh làm tôi nhớ tới Dupin của Edgar Allan Poe.',en:'It is simple enough as you explain it. You remind me of Edgar Allan Poe\'s Dupin.'},
    {w:'Holmes',vi:'Dupin là hạng xoàng. Còn bây giờ thì chẳng có tội ác nào ra hồn, chẳng có tội phạm nào đáng mặt. Tôi có trí óc mà không có việc để dùng.',en:'Dupin was a very inferior fellow. And nowadays there are no crimes and no criminals worth the name. I have the brains, and nothing to use them on.'},
    {w:'Watson',vi:'Tôi bực vì giọng tự phụ ấy nên bước ra cửa sổ. Dưới phố, một người đàn ông vạm vỡ, ăn mặc giản dị, đang chậm rãi dò số nhà, tay cầm một phong bì xanh lớn.',en:'Annoyed by his conceit, I walked to the window. Down in the street a stalwart, plainly dressed man was walking slowly, looking at the house numbers, a large blue envelope in his hand.'},
    {w:'Watson',vi:'Không biết ông kia đang tìm gì nhỉ?',en:'I wonder what that fellow is looking for?'},
    {w:'Holmes',vi:'Ý anh là ông trung sĩ thủy quân lục chiến đã giải ngũ kia à?',en:'You mean the retired sergeant of Marines?'},
    {w:'Watson',vi:'Khoác lác! Anh ta biết thừa tôi không kiểm chứng được. Vừa nghĩ thế thì có tiếng gõ cửa, rồi tiếng bước chân nặng nề lên cầu thang.',en:'Brag and bounce! He knows I cannot check his guess. I had hardly thought it when there came a loud knock, and heavy steps on the stair.'}
  ],
  msgArrive:[{w:MSG,vi:'Gửi ông Sherlock Holmes.',en:'For Mr. Sherlock Holmes.'},{w:'Watson',vi:'Đây là dịp để dập bớt cái tự phụ của anh ta. Mình phải nhìn kỹ người này trước khi hỏi.',en:'Here was a chance to take the conceit out of him. I must look this man over before I ask.'}],
  msgAnswer:[
    {w:'Watson',vi:'Xin hỏi, ông làm nghề gì?',en:'May I ask, my lad, what your trade may be?'},
    {w:MSG,vi:'Người đưa thư, thưa ngài. Đồng phục của tôi đang đem đi sửa.',en:'Commissionaire, sir. Uniform away for repairs.'},
    {w:'Watson',vi:'Còn trước đó?',en:'And you were?'},
    {w:MSG,vi:'Trung sĩ, thưa ngài. Bộ binh nhẹ Thủy quân lục chiến Hoàng gia. Không có thư trả lời ạ? Vâng, thưa ngài.',en:'A sergeant, sir. Royal Marine Light Infantry. No answer? Right, sir.'},
    {w:'Watson',vi:'Ông ta dập gót, giơ tay chào rồi đi mất. Tôi phải thú nhận là mình sững người.',en:'He clicked his heels, raised his hand in salute, and was gone. I confess I was considerably startled.'}
  ],

// ---------- Interaction ----------
let target=null;
const NAMES={holmes:'Holmes',gregson:'Gregson',lestrade:'Lestrade',stamford:'Stamford',constable:{vi:'Cảnh sát',en:'Constable'},barman:{vi:'Người pha rượu',en:'Barman'},messenger:MSG};
const DV={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function findTarget(){ const rx=player.x+DV[player.dir][0]*9, ry=player.y-4+DV[player.dir][1]*9; let best=null, bd=1e9;
  W.items.forEach(id=>{ if(S.found.has(id)||(W.avail&&!W.avail(id))) return; const s=SPOT[id], d=Math.hypot(s[0]-rx,s[1]-ry); if(d<(s[2]||17) && d<bd){ bd=d; best=id; } });
  (W.talk||[]).forEach(id=>{ const n=npcs[id]; if(!n||n.goto) return; const d=Math.hypot(n.x-rx,n.y-4-ry); if(d<18 && d<bd){ bd=d; best=id; } });
  return best; }
function promptFor(id){ if(CLUES[id]) return 'E: '+Lg(UI.inspect); const n=NAMES[id]||id; return 'E: '+Lg(UI.talk)+' – '+(typeof n==='string'?n:Lg(n)); }

  for(const r of rects) if(x+3>=r.x && x-4<=r.x+r.w && y-1>=r.y && y-5<=r.y+r.h) return true;
  for(const k in npcs){ const n=npcs[k]; if(!n.goto && !n.ghost && Math.abs(n.x-x)<8 && Math.abs(n.y-y)<6) return true; }
  return false; }

  const sp=(keys.ShiftLeft||keys.ShiftRight)?96:64, dx=mx*sp*dt, dy=my*sp*dt;

// ---------- Timers, particles, NPC movement ----------
const TIMERS=[], FX=[];
function after(sec,fn){ TIMERS.push({t:sec,fn}); }
function walkTo(n,pts,then,sp){ if(!Array.isArray(pts[0])) pts=[pts]; n.goto={pts:pts.slice(),then,sp:sp||n.speed||40}; n.pose=null; n.lock=false; }
function npcFree(n,x,y){ for(const px of [x-4,x+3]) for(const py of [y-5,y-1]){ if(px<2||py<2||px>WPX-2||py>HPX-2) return false; if(solidT[Math.floor(py/TS)][Math.floor(px/TS)]) return false; }
  for(const r of rects) if(x+3>=r.x && x-4<=r.x+r.w && y-1>=r.y && y-5<=r.y+r.h) return false;
  if(Math.abs(player.x-x)<9 && Math.abs(player.y-y)<7) return false; return true; }
const faceTo=(n,dx,dy)=>{ n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d'); };
let saveT=0;
function npcStep(dt){

  for(const k in npcs){ const n=npcs[k]; if(!n) continue;
    if(n.goto){ const pd=Math.hypot(player.x-n.x,player.y-n.y);
      if(n.pauseNear && pd<24 && S.mode==='play'){ n.fr=0; faceTo(n,player.x-n.x,player.y-n.y); continue; }
      const t=n.goto.pts[0], dx=t[0]-n.x, dy=t[1]-n.y, d=Math.hypot(dx,dy);
      if(d<1.2){ n.x=t[0]; n.y=t[1]; n.goto.pts.shift(); if(!n.goto.pts.length){ const th=n.goto.then; n.goto=null; n.fr=0; n.home=n.dir; n.wt=2+Math.random()*4; if(th) th(); } continue; }
      const st=Math.min(n.goto.sp*dt,d), nx=n.x+dx/d*st, ny=n.y+dy/d*st;
      if(n.ghost||npcFree(n,nx,ny)){ n.x=nx; n.y=ny; n.stuck=0; } else { n.stuck=(n.stuck||0)+dt; if(n.stuck>1 && n.wander){ n.goto=null; n.wt=1+Math.random()*2; } }
      faceTo(n,dx,dy); n.walkT=(n.walkT||0)+dt*7; n.fr=[1,0,2,0][Math.floor(n.walkT)%4]; continue; }
    n.fr=0;
    if(S.mode!=='play') continue;

    if(n.routine && !n.busy){ n.rt=(n.rt===undefined?1:n.rt)-dt; if(n.rt<=0){ n.ri=((n.ri===undefined?-1:n.ri)+1)%n.routine.length; const s=n.routine[n.ri];
        walkTo(n,s.pts,()=>{ n.dir=s.dir||n.dir; n.home=n.dir; n.pose=s.pose||null; n.lock=!!s.pose; },n.speed||36); n.rt=s.dur+8; } continue; }
    if(n.wander){ n.wt=(n.wt===undefined?Math.random()*3:n.wt)-dt; if(n.wt<=0){ const w=n.wander; n.wt=2+Math.random()*4;
        for(let i=0;i<10;i++){ const x=w[0]+Math.random()*(w[2]-w[0]), y=w[1]+Math.random()*(w[3]-w[1]); if(npcFree(n,x,y) && Math.hypot(x-n.x,y-n.y)>12){ walkTo(n,[x,y],null,n.speed||28); break; } } } } }

Object.assign(CLUES,{
  mirror:{ t:{vi:'Tấm gương sau quầy',en:'The mirror behind the bar'}, d:{vi:'Trong gương là một người đàn ông gầy gò, da sạm nắng, vai trái hơi xuôi. Mới vài tháng trước tôi còn khỏe mạnh. Chiến tranh và cơn sốt đã lấy đi gần hết sức lực của tôi.',en:'In the glass is a thin man, burnt brown by the sun, his left shoulder held a little low. A few months ago I was healthy. The war and the fever have taken most of my strength.'}, h:{vi:'Ở London tôi không quen ai. Ngày ngày tôi chỉ quanh quẩn giữa khách sạn và các quán ăn.',en:'I know nobody in London. My days go round between the hotel and the eating-houses.'}, by:'Watson' },
  strand:{ t:{vi:'Phố Strand ngoài cửa',en:'The Strand outside'}, d:{vi:'Qua ô kính cửa ra vào, phố Strand tấp nập: xe ngựa nối đuôi nhau, người đi đường che ô, tiếng rao báo. London giống như cái ao lớn mà mọi kẻ vô công rồi nghề của đế quốc đều trôi dạt về.',en:'Through the door-glass the Strand is busy: cabs nose to tail, people under umbrellas, newsboys calling. London is like a great cesspool into which all the loungers and idlers of the Empire are drained.'}, h:{vi:'Tôi cũng là một kẻ trôi dạt như thế. Phải tìm cách thay đổi.',en:'I am one of those drifters myself. Something must change.'}, by:'Watson' },
  skeleton:{ t:{vi:'Bộ xương trong góc',en:'The skeleton in the corner'}, d:{vi:'Một bộ xương người dựng trên giá, dùng để học giải phẫu. Vài đốt xương có vết bút chì đánh dấu.',en:'A human skeleton on a stand, used for anatomy classes. Some of the bones carry pencil marks.'}, h:{vi:'Ở đây người ta không học y theo kiểu thông thường. Ai làm thí nghiệm gì thì tự lo lấy.',en:'Nobody here studies medicine the ordinary way. Each man pursues his own experiments.'}, by:'Stamford' },
  books:{ t:{vi:'Chồng sách trên bàn',en:'The pile of books'}, d:{vi:'Sách giải phẫu và hóa học, mép trang dính đầy vết hóa chất, ghi chú bằng chữ nhỏ li ti. Một cuốn mở ở trang nói về các chất độc thực vật.',en:'Books on anatomy and chemistry, their margins stained with chemicals and covered with tiny notes. One lies open at a page on vegetable poisons.'}, h:{vi:'Anh ta đọc rất nhiều, nhưng toàn những thứ lạ lùng. Nói chung là chẳng ai biết anh ta định làm gì với chừng ấy kiến thức.',en:'He reads a great deal, but on odd subjects. Nobody quite knows what he means to do with it all.'}, by:'Stamford' },
  hearth:{ t:{vi:'Lò sưởi',en:'The fireplace'}, d:{vi:'Lò sưởi lớn, đá ốp sạch sẽ, củi khô xếp sẵn. Trên bệ là đồng hồ để bàn và chỗ trống chờ đồ đạc của chủ mới.',en:'A broad fireplace, its stone clean, dry logs laid ready. On the mantel stands a clock, with space left for the new tenants\' things.'}, h:{vi:'Mùa đông London lạnh và ẩm. Một lò sưởi tốt đáng giá bằng nửa tiền thuê.',en:'A London winter is cold and damp. A good fire is worth half the rent.'}, by:'Watson' },
  shelf:{ t:{vi:'Giá sách',en:'The bookshelf'}, d:{vi:'Một giá sách cao, còn trống quá nửa. Holmes đã kịp xếp lên vài chồng sổ tay dày cộp và những tập báo cắt dán.',en:'A tall bookshelf, more than half empty. Holmes has already put up some thick notebooks and volumes of newspaper cuttings.'}, h:{vi:'Mấy tập báo cắt ấy là gì nhỉ? Toàn tin về những vụ án.',en:'What are those cuttings? All of them are reports of crimes.'}, by:'Watson' },

  chem:{ t:{vi:'Bàn hóa chất của Holmes',en:'Holmes\'s chemical table'}, d:{vi:'Chiếc bàn ở góc phủ đầy ống nghiệm, bình cổ cong và một đèn cồn. Mặt gỗ loang lổ vết acid. Thứ gì đó trong bình đang sủi bọt và bốc mùi khó chịu.',en:'The corner table is covered in test-tubes, a retort and a spirit lamp. The wood is pitted with acid stains. Something in a flask is bubbling and gives off a foul smell.'}, h:{vi:'Anh ta có thể đứng ở đây cả ngày mà không biết mệt.',en:'He can stand here all day without tiring.'}, by:'Watson' },
  pup:{ t:{vi:'Chú chó bull con',en:'My bull pup'}, d:{vi:'Chú chó bull con của tôi chạy lăng xăng quanh tấm thảm, đánh hơi mọi thứ trong phòng mới.',en:'My bull pup trots round the rug, sniffing at everything in the new rooms.'}, h:{vi:'Ít nhất trong nhà này còn có một sinh vật không làm tôi khó hiểu.',en:'At least one creature in this house does not puzzle me.'}, by:'Watson' },

  court:{ t:{vi:'Audley Court',en:'Audley Court'}, d:{vi:'Một lối đi hẹp dẫn vào khoảng sân vuông lát đá, bốn bề là những căn nhà tồi tàn. Trẻ con nhem nhuốc chơi đùa khắp nơi, rãnh nước bốc mùi, cửa sổ ám khói than.',en:'A narrow passage leads into a quadrangle paved with flags and lined by sordid dwellings. Dirty children play everywhere, the gutters smell, and the windows are black with coal-smoke.'}, h:{vi:'Không phải khu phố dễ chịu gì. Một cảnh sát tuần đêm thì chỉ thuê nổi chỗ như thế này.',en:'Not an attractive locality. A constable on night duty can afford no better.'}, by:'Watson' },

const RQS=[
 {id:'night',needs:[],q:{vi:'Kể lại đêm qua từ đầu.',en:'Tell us about last night from the beginning.'},lines:[
  {w:'Holmes',vi:'Chúng tôi muốn nghe chính miệng anh kể lại.',en:'We should like to hear it all from your own lips.'},
  {w:'Rance',vi:'Ca của tôi từ mười giờ tối tới sáu giờ sáng. Mười một giờ có một vụ đánh nhau ở quán White Hart, ngoài ra thì yên ổn. Một giờ trời bắt đầu mưa, tôi gặp Harry Murcher, người tuần khu Holland Grove, hai đứa đứng nói chuyện ở góc phố Henrietta.',en:'My time is from ten at night to six in the morning. At eleven there was a fight at the White Hart; otherwise it was quiet. At one o\'clock it began to rain, and I met Harry Murcher, who has the Holland Grove beat, and we stood together at the corner of Henrietta Street a-talkin\'.'},
  {w:'Rance',vi:'Khoảng hai giờ, tôi nghĩ nên đi một vòng xem đường Brixton có ổn không. Đường bẩn và vắng tanh, không một bóng người, chỉ một hai chiếc xe ngựa chạy qua.',en:'Presently, maybe about two, I thought I would take a look round and see that all was right down the Brixton Road. It was precious dirty and lonely. Not a soul did I meet, though a cab or two went past me.'},
  {w:'Rance',vi:'Tôi đang thong thả đi, nghĩ bụng giá có ly gin nóng thì tuyệt, thì chợt thấy ánh đèn le lói ở cửa sổ đúng căn nhà ấy. Tôi biết hai căn ở Lauriston Gardens bỏ trống, vì chủ nhà không chịu sửa cống, dù người thuê cuối cùng đã chết vì thương hàn.',en:'I was a-strollin\' down, thinkin\' how uncommon handy a four of gin hot would be, when suddenly the glint of a light caught my eye in the window of that same house. I knew those two houses in Lauriston Gardens was empty, on account of him that owns them won\'t have the drains seen to, though the very last tenant died o\' typhoid fever.'},
  {w:'Rance',vi:'Thấy có đèn, tôi nghi có chuyện chẳng lành. Tôi đi tới cửa...',en:'I was knocked all in a heap, therefore, at seeing a light, and I suspected as something was wrong. When I got to the door...'} ]},
 {id:'gate',needs:['night'],q:{vi:'Vì sao anh dừng lại, rồi quay ra cổng vườn?',en:'Why did you stop, and walk back to the garden gate?'},lines:[
  {w:'Holmes',vi:'Anh dừng lại, rồi quay ra cổng vườn. Vì sao vậy?',en:'You stopped, and then walked back to the garden gate. What did you do that for?'},
  {w:'Rance',vi:'(giật nảy mình, trố mắt nhìn Holmes) Sao... sao ông biết? Đúng là vậy. Tới cửa thì im phăng phắc, vắng vẻ quá, tôi nghĩ có thêm người đi cùng cũng chẳng hại gì.',en:'(with a violent jump, staring at Holmes in utmost amazement) Why, that\'s true, sir; though how you come to know it, Heaven only knows. When I got up to the door it was so still and so lonesome that I thought I\'d be none the worse for someone with me.'},
  {w:'Rance',vi:'Tôi chẳng sợ thứ gì ở bên này nấm mồ, nhưng tôi chợt nghĩ biết đâu đó là hồn ma của gã chết vì thương hàn đang đi kiểm tra cái cống đã giết hắn. Tôi ra cổng xem có thấy đèn của Murcher không, nhưng chẳng thấy ai.',en:'I ain\'t afeared of anything on this side o\' the grave; but I thought that maybe it was him that died o\' the typhoid inspecting the drains what killed him. The thought gave me a kind o\' turn, and I walked back to the gate to see if I could see Murcher\'s lantern, but there wasn\'t no sign of him.'},
  {w:'Rance',vi:'Thế là tôi lấy hết can đảm quay lại, đẩy cửa bước vào. Bên trong im lặng. Tôi vào căn phòng có ánh đèn. Một ngọn nến cháy chập chờn trên bệ lò sưởi, nến sáp đỏ, và nhờ ánh nến tôi thấy...',en:'So I took my courage and went back and pushed the door open. All was quiet inside, so I went into the room where the light was a-burnin\'. There was a candle flickerin\' on the mantelpiece, a red wax one, and by its light I saw...'} ]},
 {id:'inside',needs:['gate'],q:{vi:'Rồi anh đã làm gì trong căn phòng?',en:'And what did you do in the room?'},lines:[
  {w:'Holmes',vi:'Phải, tôi biết hết những gì anh thấy. Anh đi vòng quanh phòng mấy lượt, anh quỳ xuống cạnh xác chết, rồi anh đi qua thử mở cửa bếp, rồi...',en:'Yes, I know all that you saw. You walked round the room several times, and you knelt down by the body, and then you walked through and tried the kitchen door, and then...'},
  {w:'Rance',vi:'(bật dậy, mặt hoảng hốt, ánh mắt đầy nghi ngờ) Lúc ấy ông nấp ở đâu mà thấy hết vậy? Tôi thấy ông biết nhiều hơn mức nên biết đấy!',en:'(springing to his feet with a frightened face and suspicion in his eyes) Where was you hid to see all that? It seems to me that you knows a deal more than you should.'},
  {w:'Holmes',vi:'(cười, đưa danh thiếp của mình qua bàn) Đừng có bắt tôi vì tội giết người. Tôi là một con chó săn chứ không phải con sói. Ông Gregson hay ông Lestrade sẽ bảo lãnh cho tôi. Kể tiếp đi.',en:'(laughing, and throwing his card across the table) Don\'t get arresting me for the murder. I am one of the hounds and not the wolf; Mr. Gregson or Mr. Lestrade will answer for that. Go on, though.'} ]},
 {id:'whistle',needs:['inside'],q:{vi:'Sau đó anh làm gì?',en:'What did you do next?'},lines:[
  {w:'Rance',vi:'(ngồi xuống, vẫn còn ngờ vực) Tôi quay ra cổng, thổi còi. Murcher và hai người nữa chạy tới.',en:'(resuming his seat, without however losing his mystified expression) I went back to the gate and sounded my whistle. That brought Murcher and two more to the spot.'} ]},
 {id:'street',needs:['whistle'],q:{vi:'Lúc ấy ngoài đường có ai không?',en:'Was the street empty then?'},lines:[
  {w:'Rance',vi:'À, nếu tính những người giúp được gì thì không có ai.',en:'Well, it was, as far as anybody that could be of any good goes.'},
  {w:'Holmes',vi:'Ý anh là sao?',en:'What do you mean?'},

 {id:'face',needs:['street'],q:{vi:'Gã ấy trông thế nào?',en:'What sort of a man was he?'},lines:[

  {w:'Holmes',vi:'(sốt ruột) Mặt hắn, quần áo hắn... anh không để ý sao?',en:'(impatiently) His face, his dress, didn\'t you notice them?'},
  {w:'Rance',vi:'Để ý chứ, tôi với Murcher còn phải đỡ hắn đứng dậy. Hắn cao lêu nghêu, mặt đỏ gay, nửa dưới khuôn mặt quấn kín...',en:'I should think I did notice them, seeing that I had to prop him up, me and Murcher between us. He was a long chap, with a red face, the lower part muffled round...'},

 {id:'coat',needs:['street'],q:{vi:'Hắn mặc gì?',en:'How was he dressed?'},lines:[{w:'Rance',vi:'Một cái áo khoác màu nâu.',en:'A brown overcoat.'}]},

Object.assign(CLUES,{
  advert:{ t:{vi:'Mẩu quảng cáo',en:'The advertisement'}, d:{vi:'“Nhặt được ở đường Brixton, sáng nay, trên lối đi giữa quán White Hart và Holland Grove, một chiếc nhẫn cưới bằng vàng. Xin liên hệ bác sĩ Watson, 221B phố Baker, từ tám đến chín giờ tối nay.”',en:'"In Brixton Road, this morning, a plain gold wedding ring, found in the roadway between the White Hart Tavern and Holland Grove. Apply Dr. Watson, 221B, Baker Street, between eight and nine this evening."'}, h:{vi:'Xin lỗi vì đã dùng tên anh. Nếu tôi dùng tên mình, mấy gã ngốc kia sẽ nhận ra và chen vào làm hỏng việc.',en:'Excuse my using your name. If I used my own some of these dunderheads would recognise it, and want to meddle in the affair.'} },

  oldbook:{ t:{vi:'Cuốn sách cổ',en:'The old book'}, d:{vi:'“De Jure inter Gentes”, in bằng tiếng Latin ở Liège năm 1642. Holmes mua nó ở một sạp sách cũ hôm qua. Trang đầu có ghi bằng mực đã phai: “Ex libris Guliolmi Whyte”.',en:'"De Jure inter Gentes", published in Latin at Liège in 1642. Holmes picked it up at a stall yesterday. On the fly-leaf, in faded ink: "Ex libris Guliolmi Whyte".'}, h:{vi:'Không biết William Whyte là ai. Có lẽ là một luật sư thực dụng nào đó của thế kỷ mười bảy.',en:'I wonder who William Whyte was. Some pragmatical seventeenth-century lawyer, I suppose.'} },

function askMenu(o){ const asked=o.asked; const show=()=>{ if(o.over()) return; S.mode='board'; const av=o.qs.filter(q=>q.needs.every(n=>asked.has(n)));
  showPage(`${o.art?`<img class="art" alt="" src="${artURL(o.art)}">`:''}<h2>${T(o.title)}</h2><p class="meta">${T(o.sub)}</p>
    <div class="opts">${av.map(q=>`<button class="opt${asked.has(q.id)?' right':''}" data-q="${q.id}">${asked.has(q.id)?'✓ ':''}${T(q.q)}</button>`).join('')}</div>
    <p class="meta">${esc(Lg({vi:'Đã hỏi',en:'Asked'}))}: ${asked.size}/${o.qs.length}</p>`,
  ()=>page.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const q=o.qs.find(x=>x.id===b.dataset.q); hidePage(); rerender=()=>{};
    runDialog(q.lines,()=>{ asked.add(q.id); if(o.qs.every(x=>asked.has(x.id))){ rerender=()=>{}; S.mode='play'; o.done(); } else show(); }); }));
  rerender=show; }; show(); }
function sceneEnd(n,text,teaser,next){ S.mode='end';

    <div class="row">${next?`<button class="btn" id="nx">${esc(Lg({vi:'Sang Màn '+(n+1),en:'On to Scene '+(n+1)}))}</button>`:''}<button class="btn alt" id="jr">${esc(Lg({vi:'Đọc sổ ghi chép',en:'Read the journal'}))}</button></div>`,
    ()=>{ $('jr').onclick=()=>{ renderJournal(); $('ok').onclick=()=>draw(); }; if(next) $('nx').onclick=()=>{ hidePage(); rerender=()=>{}; go(next); }; });
  draw(); rerender=draw; }

// ---------- texts ----------
Object.assign(CLUES,{
  milk8:{ t:{vi:'Ly sữa',en:'The glass of milk'}, d:{vi:'Một ly sữa có hòa nửa viên thuốc.',en:'A glass of milk with half a pill dissolved in it.'} },
  telegraph:{ t:{vi:'Báo Daily Telegraph',en:'The Daily Telegraph'}, d:{vi:'“Hiếm có vụ án nào bí ẩn hơn. Cái tên Đức của nạn nhân, việc không có động cơ, và dòng chữ ghê rợn trên tường đều chỉ về phía những người tị nạn chính trị và các nhà cách mạng.”',en:'"There had seldom been a tragedy which presented stranger features. The German name of the victim, the absence of all other motive, and the sinister inscription on the wall, all pointed to its perpetration by political refugees and revolutionists."'}, h:{vi:'Hội kín, hội Carbonari, bà Brinvilliers, thuyết Darwin... họ nhét tất cả vào một bài báo.',en:'Secret societies, the Carbonari, the Marchioness de Brinvilliers, the Darwinian theory... they crammed it all into one article.'}, by:'Watson' },
  standard:{ t:{vi:'Báo Standard',en:'The Standard'}, d:{vi:'“Nạn nhân là một quý ông người Mỹ, ông Enoch J. Drebber ở Cleveland, Ohio, trọ tại nhà bà Charpentier ở Torquay Terrace, Camberwell, cùng thư ký riêng là ông Joseph Stangerson. Hai người rời nhà trọ hôm thứ Ba để bắt chuyến tàu tốc hành đi Liverpool.”',en:'"The deceased was an American gentleman, Mr. Enoch J. Drebber of Cleveland, Ohio, boarding with Madame Charpentier in Torquay Terrace, Camberwell, accompanied by his private secretary, Mr. Joseph Stangerson. The two left their landlady on Tuesday, intending to catch the Liverpool express."'}, h:{vi:'Thư ký Stangerson. Hắn đang ở đâu?',en:'The secretary, Stangerson. Where is he now?'}, by:'Watson' },
  dailynews:{ t:{vi:'Báo Daily News',en:'The Daily News'}, d:{vi:'“Không nghi ngờ gì đây là một tội ác chính trị... Ông Gregson và ông Lestrade của Scotland Yard đang phụ trách vụ việc, và người ta tin chắc hai ông sẽ sớm làm sáng tỏ.”',en:'"There was no doubt as to the crime being a political one... Mr. Gregson and Mr. Lestrade, of Scotland Yard, are both engaged upon the case, and it is confidently anticipated that these well-known officers will speedily throw light upon the matter."'}, h:{vi:'Dù chuyện gì xảy ra, Lestrade và Gregson chắc chắn sẽ được tiếng. Kẻ ngốc nào cũng tìm được kẻ ngốc hơn để ngưỡng mộ mình.',en:'Whatever happens, Lestrade and Gregson will be sure to score. Un sot trouve toujours un plus sot qui l\'admire.'} },
  door7:{ t:{vi:'Khách sạn Halliday',en:'Halliday\'s Private Hotel'}, d:{vi:'Người hầu khách sạn nói ông Stangerson ở phòng tầng hai. Cửa khóa trái từ bên trong. Dưới khe cửa, một dòng máu đỏ nhỏ đã chảy ra, vắt ngang lối đi, đọng lại thành vũng ở chân tường đối diện. Tôi và anh ta phá cửa xông vào.',en:'The boots said Mr. Stangerson was upstairs. The door was locked on the inside. From under it curled a little red ribbon of blood, which had meandered across the passage and formed a little pool along the skirting at the other side. We broke the door in.'}, by:'Lestrade' },
  body7:{ t:{vi:'Thi thể Stangerson',en:'Stangerson\'s body'}, d:{vi:'Ông Joseph Stangerson nằm co quắp bên cửa sổ, đã chết khá lâu, chân tay lạnh cứng. Ông bị đâm một nhát vào sườn trái, sâu tới tận tim. Ví tiền còn nguyên tám mươi bảng, không mất gì cả.',en:'Mr. Joseph Stangerson lay all huddled up by the window, dead for some time, his limbs rigid and cold. He had been stabbed in the left side, deep enough to penetrate the heart. His purse held eighty-odd pounds; nothing had been taken.'}, by:'Lestrade' },
  rache7:{ t:{vi:'Lại là chữ RACHE',en:'RACHE again'}, d:{vi:'Và bây giờ đến phần lạ lùng nhất. Ông nghĩ có gì phía trên xác chết? Viết bằng máu, chữ RACHE.',en:'And now comes the strange part of the affair. What do you suppose was above the murdered man? The word RACHE, written in letters of blood.'}, by:'Lestrade' },
  window7:{ t:{vi:'Cửa sổ và chiếc thang',en:'The window and the ladder'}, d:{vi:'Cửa sổ mở. Một cậu bé giao sữa đi ngang lúc rạng sáng thấy một chiếc thang dựng vào cửa sổ tầng hai, rồi một người đàn ông leo xuống, rất thản nhiên. Cao, mặt đỏ, mặc áo khoác nâu dài. Cậu bé tưởng là thợ mộc.',en:'The window was open. A milk boy passing at dawn saw a ladder raised against a second-floor window, and a man came down it, quite coolly. Tall, reddish face, a long brownish coat. The boy took him for a carpenter.'}, by:'Lestrade' },
  basin7:{ t:{vi:'Chậu rửa',en:'The basin'}, d:{vi:'Nước trong chậu đỏ máu: hung thủ đã rửa tay ở đây sau khi giết người. Trên tấm ga trải giường có vết lau con dao.',en:'The water in the basin was red with blood: the murderer washed his hands there after the deed. There were marks on the sheets where he had wiped his knife.'}, by:'Lestrade' },
  telegram7:{ t:{vi:'Bức điện tín',en:'The telegram'}, d:{vi:'Trong túi nạn nhân có một bức điện gửi từ Cleveland cách đây khoảng một tháng, chỉ có một dòng: “J. H. đang ở châu Âu.” Không ký tên.',en:'In the dead man\'s pocket was a telegram dated from Cleveland about a month ago, containing the words "J. H. is in Europe." There was no name appended.'}, by:'Lestrade' },
  pills7:{ t:{vi:'Hộp thuốc',en:'The pill box'}, d:{vi:'Trên bậu cửa sổ có một hộp gỗ nhỏ đựng thuốc mỡ, bên trong là hai viên thuốc.',en:'On the window-sill lay a small chip ointment box containing a couple of pills.'}, by:'Lestrade', h:{vi:'(Holmes bật dậy, reo lên đắc thắng) Mắt xích cuối cùng! Vụ án của tôi đã hoàn chỉnh.',en:'(Holmes sprang from his chair with an exclamation of delight) The last link! My case is complete.'} },
  novel7:{ t:{vi:'Đồ đạc trên bàn',en:'Things on the table'}, d:{vi:'Một cuốn tiểu thuyết ông ta đọc trước khi ngủ. Cái tẩu thuốc trên ghế cạnh giường. Một ly nước trên bàn.',en:'A novel, with which he had read himself to sleep. His pipe on a chair beside him. A glass of water on the table.'}, by:'Lestrade' },

const BAKER6=[D('Watson',`(Sáng hôm sau, mọi tờ báo đều đăng đầy tin về “Bí ẩn Brixton”. Holmes và tôi đọc chúng trong bữa sáng.)`,`(Next morning the papers were full of the "Brixton Mystery". Holmes and I read them over breakfast.)`)];
const IRREG=[D('Watson',`(Tiếng chân rầm rập dưới cầu thang, kèm tiếng bà chủ nhà phản đối ầm ĩ. Nửa tá đứa trẻ đường phố bẩn thỉu, rách rưới nhất tôi từng thấy ùa vào phòng.)`,`(There was a pattering of many steps in the hall, accompanied by audible expressions of disgust from our landlady. Half a dozen of the dirtiest and most ragged street Arabs that ever I clapped eyes on burst in.)`),
  D('Holmes',`Nghiêm! (Lũ trẻ đứng thẳng hàng như những bức tượng nhỏ nhem nhuốc) Lần sau chỉ cần Wiggins lên báo cáo, những đứa khác đợi ngoài đường. Tìm thấy chưa, Wiggins?`,`'Tention! (the six dirty little scoundrels stood in a line like so many disreputable statuettes) In future you shall send up Wiggins alone to report, and the rest of you must wait in the street. Have you found it, Wiggins?`),
  D(WIG,`Chưa ạ, thưa ông.`,`No, sir, we hain't.`),
  D('Holmes',`Tôi cũng không mong là có. Cứ tiếp tục cho tới khi tìm ra. Đây là tiền công. (phát mỗi đứa một shilling) Đi đi, lần sau mang về tin tốt hơn.`,`I hardly expected you would. You must keep on until you do. Here are your wages. (handing each a shilling) Now, off you go, and come back with a better report next time.`)];
const IRREG2=[D('Watson',`(Lũ trẻ chạy ào xuống cầu thang như bầy chuột.)`,`(They swarmed away downstairs like so many rats.)`),
  D('Holmes',`Một đứa ăn mày con ấy làm được nhiều việc hơn cả tá cảnh sát. Thấy người mặc sắc phục là ai cũng ngậm miệng. Còn lũ nhóc này đi đâu cũng lọt, nghe được mọi chuyện. Chúng chỉ thiếu tổ chức thôi.`,`There\'s more work to be got out of one of those little beggars than out of a dozen of the force. The mere sight of an official-looking person seals men\'s lips. These youngsters, however, go everywhere and hear everything. All they want is organisation.`),
  D('Holmes',`(nhìn ra cửa sổ) A, Gregson đang tới, mặt mũi rạng rỡ. Đang lên đây đấy.`,`(looking out of the window) Hullo, here\'s Gregson coming down the road with beatitude written upon every feature of his face. Bound for us, I know.`)];
const GREG_IN=[D('Gregson',`(xông vào, chẳng thèm chào hỏi) Ông bạn thân mến, chúc mừng tôi đi! Tôi đã làm cho mọi chuyện sáng tỏ như ban ngày.`,`(bursting in without a greeting) My dear fellow, congratulate me! I have made the whole thing as clear as day.`),
  D('Holmes',`Ý anh là anh đã đi đúng hướng?`,`Do you mean that you are on the right track?`),
  D('Gregson',`Đúng hướng! Thưa ông, chúng tôi đã tống kẻ đó vào xà lim rồi. Tên hắn là Arthur Charpentier, thiếu úy hải quân của Nữ hoàng.`,`The right track! Why, sir, we have the man under lock and key. Arthur Charpentier, sub-lieutenant in Her Majesty\'s navy.`),
  D('Holmes',`(thở phào, mỉm cười) Mời ngồi, thử một điếu xì gà. Chúng tôi rất nóng lòng muốn biết anh làm thế nào.`,`(with a sigh of relief, relaxing into a smile) Take a seat, and try one of these cigars. We are anxious to know how you managed it.`)];
const GQS=[
 {id:'hat',needs:[],q:{vi:'Anh tìm ra nhà trọ bằng cách nào?',en:'How did you find the boarding-house?'},lines:[
  D('Gregson',`Cái mũ nằm cạnh xác chết. Tôi tìm tới hãng Underwood & Sons, số 129 đường Camberwell. Sổ sách ghi họ đã gửi cái mũ đó cho ông Drebber, ở nhà trọ Charpentier, Torquay Terrace.`,`The hat beside the dead man. I went to Underwood & Sons, 129, Camberwell Road. He looked over his books and found it had been sent to a Mr. Drebber, residing at Charpentier\'s Boarding Establishment, Torquay Terrace.`),
  D('Holmes',`(lẩm bẩm) Khéo đấy, rất khéo.`,`(sotto voce) Smart, very smart.`)]},
 {id:'mother',needs:['hat'],q:{vi:'Bà Charpentier đã khai những gì?',en:'What did Madame Charpentier tell you?'},lines:[
  D('Gregson',`Bà ta tái mặt khi tôi hỏi. Cô con gái Alice thì bật khóc. Tôi biết ngay là có chuyện. Cuối cùng bà ta kể: Drebber ở trọ ba tuần, hầu như tối nào cũng say, và cứ trêu ghẹo cô Alice một cách thô bỉ.`,`She turned pale when I asked, and the daughter burst into tears. I knew at once something was up. At last she told me: Drebber had stayed three weeks, was nearly always drunk of an evening, and took liberties with her daughter Alice.`),
  D('Gregson',`Tối thứ Ba, hắn và Stangerson rời nhà ra ga. Một tiếng sau Drebber quay lại, say khướt, xông vào phòng, đòi cô Alice bỏ trốn với hắn, rồi túm cổ tay lôi cô ra cửa.`,`On the Tuesday he and Stangerson left for the station. Within an hour Drebber came back, the worse for drink, forced his way into the room, urged Alice to fly with him, and caught her by the wrist to drag her to the door.`)]},
 {id:'arthur',needs:['mother'],q:{vi:'Còn Arthur Charpentier thì sao?',en:'And Arthur Charpentier?'},lines:[
  D('Gregson',`Arthur, con trai bà ta, xông vào. Tôi nghe tiếng chửi rủa và xô xát. Arthur đứng ở cửa, tay cầm gậy, cười: “Hắn sẽ không làm phiền mẹ con mình nữa. Con sẽ đi theo xem hắn làm gì.” Rồi cậu ta cầm mũ đi ra phố.`,`Her son Arthur came in. There were oaths and a confused scuffle. Arthur stood laughing in the doorway with a stick in his hand: "I don\'t think that fine fellow will trouble us again. I will just go after him and see what he does." He took his hat and started off down the street.`),
  D('Gregson',`Khi tôi bắt cậu ta, cậu ta nói ngay: “Chắc các ông bắt tôi vì cái chết của gã Drebber khốn kiếp đó.” Cậu ta khai đã đi theo Drebber, bị hắn quay lại đánh, và cậu ta có cây gậy sồi to tướng. Rõ quá rồi còn gì!`,`When I arrested him he said: "I suppose you are arresting me for being concerned in the death of that scoundrel Drebber." He followed Drebber, who turned on him, and he carried a heavy oak cudgel. It is clear enough!`)]},
 {id:'lestrade',needs:['hat'],q:{vi:'Lestrade đang làm gì?',en:'What has Lestrade been doing?'},lines:[
  D('Gregson',`(xoa tay khoái chí) Lestrade đi theo hướng sai, săn lùng gã thư ký Stangerson. Gã đó vô can như đứa trẻ mới sinh. Chắc giờ anh ta đã bắt được hắn rồi cũng nên. Ha ha!`,`(rubbing his hands) Lestrade went off upon the wrong scent altogether. He is after the secretary Stangerson, who had no more to do with it than the babe unborn. I daresay he has caught him by this time. Ha ha!`)]}
];
const QUIZ6=[{q:{vi:'Gregson tin Arthur đã đánh chết Drebber bằng gậy. Điều gì cho thấy anh ta sai?',en:'Gregson thinks Arthur beat Drebber to death with a stick. What shows he is wrong?'},
  o:[{vi:'Arthur có chứng cứ ngoại phạm',en:'Arthur has an alibi'},{vi:'Trên người Drebber không hề có vết thương; ông ta chết vì thuốc độc',en:'There was no wound on Drebber at all; he died of poison'},{vi:'Cây gậy quá nhẹ',en:'The stick was too light'}],a:1,

const LEST_IN=[D('Watson',`(Đúng lúc ấy có tiếng bước chân nặng nề trên cầu thang, và Lestrade bước vào. Vẻ tự tin thường ngày đã biến mất; mặt anh ta bối rối, quần áo xộc xệch.)`,`(At that moment a heavy step sounded on the stair, and Lestrade came in. The assurance which generally marked him was gone; his face was disturbed and troubled, his clothes disarranged.)`),
  D('Lestrade',`Đây là một vụ hết sức kỳ lạ, một chuyện khó hiểu nhất.`,`This is a most extraordinary case, and a most incomprehensible affair.`),
  D('Gregson',`(đắc thắng) A, anh cũng thấy vậy à? Tôi biết thế nào anh cũng đi đến kết luận ấy. Anh đã tìm được thư ký Stangerson chưa?`,`(triumphantly) Ah, you find it so, Mr. Lestrade! I thought you would come to that conclusion. Have you managed to find the secretary, Mr. Joseph Stangerson?`),
  D('Lestrade',`(nghiêm trọng) Thư ký Joseph Stangerson đã bị giết ở khách sạn Halliday vào khoảng sáu giờ sáng nay.`,`(gravely) The secretary, Mr. Joseph Stangerson, was murdered at Halliday\'s Private Hotel about six o\'clock this morning.`),
  D('Watson',`(Tin ấy nặng nề và bất ngờ đến mức cả ba chúng tôi đều chết lặng. Gregson bật dậy, làm đổ cả ly whisky.)`,`(The intelligence was so momentous and so unexpected that we were all three fairly dumbfounded. Gregson sprang out of his chair and upset the remainder of his whisky.)`),
  D('Holmes',`Kể hết cho chúng tôi nghe, Lestrade. Từng chi tiết một.`,`Tell us everything, Lestrade. Every detail.`)];

const HOTEL0=[D('Lestrade',`(kể lại) Tôi tìm khắp các khách sạn gần ga Euston, hỏi xem có ai tên Stangerson. Cuối cùng, tám giờ sáng nay, tôi tới khách sạn Halliday ở phố Little George. Người ta bảo ông ta đã đợi một quý ông suốt hai ngày...`,`(telling it) I searched every hotel near Euston for a guest named Stangerson. At last, at eight this morning, I reached Halliday\'s Private Hotel in Little George Street. They told me he had been waiting two days for a gentleman...`)];
const HOTELEND=[D('Lestrade',`Đó là tất cả những gì tôi tìm được. Một chiếc thang, một cửa sổ mở, chữ RACHE, và hai viên thuốc trong cái hộp nhỏ.`,`That is all I found. A ladder, an open window, RACHE on the wall, and two pills in a little box.`),
  D('Holmes',`Anh có mang hộp thuốc theo không?`,`Have you them with you, the pills?`),
  D('Lestrade',`Có đây. Tôi định để chúng ở đồn, chỗ an toàn. Thật ra tôi lấy đi một cách tình cờ thôi, chẳng thấy chúng quan trọng gì.`,`I have them. I took them away by mere chance. I intended to put them in a place of safety at the Police Station. I don\'t attach any importance to them.`),
  D('Holmes',`(bật dậy) Mắt xích cuối cùng! Vụ án của tôi đã hoàn chỉnh. Đưa chúng đây.`,`(springing up) The last link! My case is complete. Give them here.`)];

const B8=[D('Holmes',`Bây giờ tôi đã nắm trong tay mọi đầu mối của mớ bòng bong này. Tất nhiên còn vài chi tiết cần bổ sung, nhưng tôi chắc chắn về mọi sự kiện chính, từ lúc Drebber chia tay Stangerson ở nhà ga cho tới khi Lestrade phát hiện ra xác Stangerson.`,`I have now in my hands all the threads which have formed such a tangle. There are, of course, details to be filled in, but I am as certain of all the main facts, from the time that Drebber parted from Stangerson at the station, up to the discovery of the body of the latter, as if I had seen them with my own eyes.`),
  D('Holmes',`Bác sĩ, anh xem giúp tôi hai viên thuốc này. Chúng có phải thuốc bình thường không?`,`Doctor, would you look at these pills. Are they ordinary pills?`)];

  o:[{vi:'Cả hai nạn nhân đều bị cướp tiền',en:'Both victims were robbed'},{vi:'Chữ RACHE bằng máu, và một người đàn ông cao, mặt đỏ, áo nâu',en:'RACHE in blood, and a tall red-faced man in a brown coat'},{vi:'Cả hai đều bị đâm',en:'Both were stabbed'}],a:1,

const LANDDOG=[D(LAND,`Con chó sục già tội nghiệp ấy à? Nó ốm lâu lắm rồi, hôm qua tôi còn nhờ ông bác sĩ cho nó đi cho nhẹ nhàng. Để tôi bế nó lên.`,`The poor old terrier? It\'s been bad so long; I asked the doctor yesterday to put it out of its pain. I\'ll bring it up.`)];
const PILL1=[D('Holmes',`(cắt đôi một viên thuốc bằng dao nhíp, thả một nửa vào ly nước, thêm chút sữa cho dễ uống) Nếu bác sĩ Watson nói đúng, nó sẽ tan ngay.`,`(cutting one of the pills in two with his penknife, dropping half into a wine-glass of water, adding milk) If our friend the Doctor is right in his conjecture, it will readily dissolve.`),
  D('Watson',`(Con chó liếm sạch ly sữa. Chúng tôi lặng lẽ ngồi nhìn nó, chờ đợi một điều gì đó kinh hoàng. Nhưng chẳng có gì xảy ra. Con chó vẫn nằm trên đệm, thở khó nhọc, nhưng rõ ràng không khá hơn cũng chẳng tệ đi.)`,`(The dog lapped it dry. We sat in silence, watching the animal intently and expecting some startling effect. None such appeared. The dog continued to lie stretched upon the cushion, breathing in a laboured way, but apparently neither the better nor the worse for its draught.)`),
  D('Lestrade',`(nhếch mép) Thế thì sao?`,`(with a smirk) Well?`)];
const PILL2=[D('Holmes',`(cắn môi, gõ ngón tay xuống bàn, sốt ruột) Không thể là trùng hợp được. Chính hai viên thuốc mà tôi đã ngờ tới từ khi thấy Drebber chết lại được tìm thấy cạnh xác Stangerson. Thế mà chúng vô hại. Như vậy là sao? Chẳng lẽ cả chuỗi suy luận của tôi sai?`,`(gnawing his lip, drumming his fingers upon the table) It can\'t be a coincidence. The very pills which I suspected in the case of Drebber are actually found after the death of Stangerson. And yet they are inert. What can it mean? Surely my whole chain of reasoning cannot have been false.`),
  D('Holmes',`(reo lên) A! Tôi biết rồi! (cắt đôi viên thứ hai, hòa vào sữa, đặt trước mặt con chó)`,`(with a perfect shriek of delight) Ah! I have it! (cutting the other pill in two, dissolving it, adding milk, and presenting it to the terrier)`),
  D('Watson',`(Lưỡi con vật chưa kịp ướt hẳn thì toàn thân nó co giật, rồi nằm cứng đờ, không còn sự sống, như bị sét đánh.)`,`(The unfortunate creature\'s tongue seemed hardly to have been moistened in it before it gave a convulsive shiver in every limb, and lay as rigid and lifeless as if it had been struck by lightning.)`)];

  o:[{vi:'Vì con chó đã quen với thuốc độc',en:'Because the dog was used to poison'},{vi:'Vì trong hộp có hai viên: một viên chứa chất độc chết người, một viên hoàn toàn vô hại',en:'Because there were two pills: one a deadly poison, the other entirely harmless'},{vi:'Vì thuốc đã hết tác dụng',en:'Because the pills had gone stale'}],a:1,
  r:{vi:'Lẽ ra tôi phải biết điều đó trước khi thấy cái hộp. Hung thủ để nạn nhân tự chọn một viên, còn hắn uống viên còn lại.',en:'I ought to have known that before ever I saw the box at all. The murderer let his victim choose one, and took the other himself.'}}];

const B9=[D('Gregson',`(không nhịn được nữa) Ông Sherlock Holmes, chúng tôi chẳng ai nghi ngờ ông là người sắc sảo, và có những phương pháp riêng. Nhưng giờ chúng tôi cần nhiều hơn là lý thuyết và bài giảng. Ông có biết tên hung thủ không?`,`(no longer able to contain himself) Look here, Mr. Sherlock Holmes, we are all ready to acknowledge that you are a smart man, and that you have your own methods of working. We want something more than mere theory and preaching now. Can you name the man who did it?`),
  D('Lestrade',`Tôi cũng đồng ý với Gregson. Cả hai chúng tôi đều đã thử và thất bại. Mọi chậm trễ có thể cho kẻ sát nhân thời gian gây thêm một tội ác nữa.`,`I cannot help agreeing with Gregson, sir. We have both tried, and we have both failed. Any further delay might give the assassin time to perpetrate some fresh atrocity.`),
  D('Holmes',`(đi đi lại lại, đầu cúi xuống) Sẽ không còn vụ giết người nào nữa. Biết tên hung thủ là một chuyện nhỏ; bắt được hắn mới khó. Hắn lanh lợi, liều mạng, lại có một người bạn khôn ngoan không kém giúp sức. Nếu hắn nghi ngờ dù chỉ một chút, hắn sẽ đổi tên và biến mất giữa bốn triệu dân của thành phố này.`,`(pacing up and down with his head sunk on his chest) There will be no more murders. Knowing the man\'s name is a small thing compared with laying our hands upon him. He is shrewd and desperate, supported by another who is as clever as himself. If he had the slightest suspicion, he would change his name, and vanish in an instant among the four million inhabitants of this great city.`)];
const B9WIG=[D(WIG,`(bước vào, khịt mũi) Xe ngựa đang đợi dưới nhà rồi, thưa ông.`,`(touching his forelock) Please, sir, I have the cab downstairs.`),
  D('Holmes',`Ngoan lắm. (lấy ra một cặp còng thép) Sao Scotland Yard không dùng loại này nhỉ? Xem lò xo hoạt động tuyệt chưa. Chúng khóa lại trong nháy mắt.`,`Good boy. (producing a pair of steel handcuffs) Why don\'t you introduce this pattern at Scotland Yard? See how beautifully the spring works. They fasten in an instant.`),
  D('Lestrade',`Loại cũ cũng đủ tốt rồi, miễn là tìm được người để còng.`,`The old pattern is good enough, if we can only find the man to put them on.`),
  D('Holmes',`(mỉm cười) Rất tốt. Wiggins, nhờ ông xà ích lên giúp tôi khiêng cái rương.`,`(smiling) Very good, very good. Just ask the cabman to step up and help me with my box, Wiggins.`)];
const CUFF=[D('Holmes',`(quỳ bên chiếc rương, cài khóa dây đai) Phụ tôi một tay với cái khóa này, anh bạn.`,`(kneeling over the trunk, busily engaged with the buckle) Just give me a help with this buckle, cabman.`),
  D('Watson',`(Gã xà ích bước tới, vẻ hơi cau có, cúi xuống đưa tay ra giúp. Đúng lúc ấy có một tiếng “cạch” sắc gọn, tiếng kim loại va nhau, và Sherlock Holmes bật dậy.)`,`(The fellow came forward with a somewhat sullen, defiant air, and put down his hands to assist. At that instant there was a sharp click, the jangling of metal, and Sherlock Holmes sprang to his feet again.)`),
  D('Holmes',`(mắt sáng rực) Thưa quý vị, xin giới thiệu ông Jefferson Hope, kẻ đã giết Enoch Drebber và Joseph Stangerson.`,`(with flashing eyes) Gentlemen, let me introduce you to Mr. Jefferson Hope, the murderer of Enoch Drebber and of Joseph Stangerson.`)];
const AFTER9=[D('Watson',`(Mọi chuyện xảy ra trong chớp mắt. Gã xà ích gầm lên, giật mạnh khỏi tay Holmes, lao về phía cửa sổ làm vỡ cả kính lẫn khung. Nhưng Gregson, Lestrade và Holmes đã lao tới như những con chó săn, lôi hắn trở lại phòng.)`,`(The whole thing occurred in a moment. With an inarticulate roar of fury the prisoner wrenched himself free from Holmes\'s grasp, and hurled himself through the window. Woodwork and glass gave way before him; but before he got quite through, Gregson, Lestrade, and Holmes sprang upon him like so many staghounds, and dragged him back into the room.)`),
  D('Watson',`(Sức hắn mạnh khủng khiếp, bốn người chúng tôi bị hất ra hết lần này đến lần khác. Chỉ đến khi Lestrade siết được cổ áo hắn, hắn mới hiểu rằng vùng vẫy là vô ích. Chúng tôi trói nốt hai chân hắn.)`,`(So powerful and so fierce was he, that the four of us were shaken off again and again. It was not until Lestrade succeeded in getting his hand inside his neckcloth that we made him realise that his struggles were of no avail; and even then we felt no security until we had pinioned his feet as well as his hands.)`),
  D('Holmes',`(thở hổn hển) Chúng ta có xe ngựa của hắn. Nó sẽ đưa hắn tới Scotland Yard. Còn bây giờ, thưa quý vị, bí ẩn nhỏ của chúng ta đã đi đến hồi kết. Các vị cứ hỏi bất cứ điều gì, tôi sẽ không từ chối trả lời.`,`(gasping for breath) We have his cab. It will serve to take him to Scotland Yard. And now, gentlemen, we have reached the end of our little mystery. You are very welcome to put any questions that you like to me now, and there is no danger that I will refuse to answer them.`)];
