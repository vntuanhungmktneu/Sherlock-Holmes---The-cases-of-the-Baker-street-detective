const LUCYT=[[D(LUCYK,`Mẹ con đâu rồi bác? Mẹ đi mà không chào con.`,`Where's mother? She never said goodbye.`),D('Ferrier',`Mẹ con đi rồi, cưng à. Mẹ đi trước tất cả chúng ta.`,`Your mother's gone, dearie. She's gone before the rest of us.`)],
  [D(LUCYK,`Ai làm ra vùng đất này hả bác? Có phải Chúa không?`,`Who made this country? Did God make it?`),D('Ferrier',`Chắc là Chúa đấy.`,`Of course He did.`),D(LUCYK,`Thế Chúa làm ra vùng đất ở dưới kia, còn vùng này thì Ngài quên không cho nước và cây cối.`,`He made the country down in Illinois, and He made the Missouri. I guess somebody else made the country in these parts. It's not nearly so well done. They forgot the water and the trees.`)]];
const PLAINREST=[D('Ferrier',`Ta nghỉ ở đây, dưới tảng đá lớn này. Con cầu nguyện đi, cưng.`,`We'll rest here, under the big boulder. You say your prayers, dearie.`),
  D(NARR,`Hai mái đầu, một mái tóc vàng óng và một mái tóc lốm đốm bạc, kề bên nhau dưới bóng đá. Rồi cả hai chìm vào giấc ngủ. Trên trời, ba con kền kền lượn vòng mỗi lúc một thấp.`,`The two heads, one golden and one grizzled, lay side by side beneath the rock. Then both slept. Overhead, three buzzards circled lower and lower.`)];
const CARAVAN=[D(NARR,`Từ phía tây, một đám bụi lớn bốc lên. Những chiếc xe ngựa phủ bạt trắng nối nhau như một con rắn khổng lồ: hàng nghìn người, đàn ông, đàn bà, trẻ con, gia súc, đang băng qua sa mạc.`,`From the west rose a great cloud of dust. Covered wagons wound along like some gigantic serpent: thousands of people, men, women and children, with their beasts, crossing the desert.`),
  D(ELDER,`(cùng vài người leo lên tảng đá) Ở đây có người! Một người đàn ông và một đứa bé!`,`(climbing the rock with others) There's somebody here! A man and a little child!`),
  D('Ferrier',`Tôi là John Ferrier. Tôi và con bé là những người cuối cùng của đoàn hai mươi mốt người. Những người kia đã chết vì đói khát ở phía nam.`,`My name is John Ferrier. Me and that little un are all that's left o' twenty-one people. The rest is all dead o' thirst and hunger away down in the south.`),
  D(ELDER,`Chúng tôi là những đứa con bị ngược đãi của Chúa, rời Nauvoo ở bang Illinois để tìm một miền đất hứa, dù nó có ở giữa sa mạc.`,`We are the persecuted children of God. We have come from Nauvoo, in the State of Illinois, to seek a haven, though it be in the heart of the desert.`),
  D(YOUNG,`(người lãnh đạo đoàn, nhìn Ferrier từ trên xe) Nếu chúng tôi đưa anh theo, anh phải theo tín ngưỡng của chúng tôi. Chúng tôi không để sói vào bầy cừu của mình.`,`(the leader, looking down from his wagon) If we take you with us, it can only be as believers in our own creed. We shall have no wolves in our fold.`)];
const QUIZ10=[{q:{vi:'Ferrier trả lời thế nào?',en:'What does Ferrier answer?'},o:[{vi:'“Tôi sẽ đi cùng các ông, với bất cứ điều kiện nào.”',en:'"Guess I\'ll come with you on any terms."'},{vi:'“Tôi thà ở lại đây.”',en:'"I\'d rather stay here."'}],a:0,
  r:{vi:'Brigham Young gật đầu: “Đưa anh ta lên xe. Từ nay anh ta là một người trong chúng ta.” Và đoàn người lại lên đường về phía Miền Đất Hứa.',en:'Brigham Young nodded: "Take him into the wagon. From now on he is one of us." And the caravan wound on towards the Promised Land.'}}];
const UTAH0=[D(NARR,`Mười hai năm trôi qua. Giữa sa mạc, những người tị nạn đã dựng lên thành phố Salt Lake, với những cánh đồng xanh tốt và những con đường thẳng tắp. John Ferrier làm ăn phát đạt, trở thành một trong những người giàu nhất vùng. Bé Lucy đã thành một thiếu nữ, được gọi là “Đóa hoa của Utah”.`,`Twelve years passed. In the desert the refugees had raised Salt Lake City, with green fields and straight streets. John Ferrier prospered and became one of the richest men in the valley. Little Lucy grew into a young woman, known as "the Flower of Utah".`),
  D('Lucy',`Cha nhờ mình vào thành phố lo việc. Đi thôi, Poncho!`,`Father wants me to go into the city on an errand. Come on, Poncho!`)];
const RESCUE=[D(NARR,`Một đàn gia súc khổng lồ từ đồng cỏ tràn ra kín đường. Lucy định len qua, nhưng những cái sừng va vào mạng sườn con ngựa. Poncho hoảng loạn, chồm lên hí vang giữa biển sừng và móng guốc.`,`A great drove of cattle from the plains filled the road. Lucy tried to push through, but a horn struck the mustang\'s flank. Poncho reared and plunged in terror amid the sea of horns and hooves.`),
  D('Jefferson Hope',`(một bàn tay rắn chắc nắm lấy dây cương, kéo con ngựa ra khỏi đàn bò) Cô không bị thương chứ, thưa cô?`,`(a sinewy hand caught the frightened horse by the curb and forced a way through the drove) You're not hurt, I hope, miss.`),
  D('Lucy',`Tôi sợ chết khiếp. Ai mà ngờ Poncho lại sợ một đàn bò đến vậy?`,`I'm awful frightened. Whoever would have thought that Poncho would have been so scared by a lot of cows?`),
  D('Jefferson Hope',`Tạ ơn Chúa là cô vẫn ngồi vững. Tôi đoán cô là con gái của John Ferrier. Hãy hỏi ông ấy có nhớ nhà Jefferson Hope ở St. Louis không. Cha tôi và ông ấy từng thân nhau lắm.`,`Thank God you kept your seat. I guess you are the daughter of John Ferrier. Ask him if he remembers the Jefferson Hopes of St. Louis. If he's the same Ferrier, my father and he were pretty thick.`),
  D('Lucy',`Sao anh không tự đến mà hỏi? Cha tôi có nhiều điều phải cảm ơn anh, tôi cũng vậy. Nếu lũ bò giẫm lên tôi thì cha sẽ không bao giờ vượt qua nổi.`,`Hadn't you better come and ask yourself? He has a good deal to thank you for, and so have I. If those cows had jumped on me he'd have never got over it.`),
  D('Jefferson Hope',`Tôi cũng vậy.`,`Neither would I.`),
  D('Lucy',`(bật cười) Anh à! Tôi chẳng thấy chuyện đó liên quan gì tới anh. Anh còn chẳng phải bạn của nhà tôi.`,`(laughing) You! Well, I don't see that it would make much matter to you, anyhow. You ain't even a friend of ours.`),
  D('Jefferson Hope',`Bây giờ thì chưa. Nhưng sau này cô sẽ phải coi tôi là bạn.`,`I ain't that now. You'll have to be one in the future.`)];
const FAREWELL=[D('Jefferson Hope',`Anh phải đi rồi, Lucy. Anh lên Nevada khai thác mỏ bạc. Anh không bắt em đi cùng lúc này, nhưng khi anh quay lại, em sẽ sẵn sàng đi với anh chứ?`,`I am off, Lucy. I'm going up to the silver mines in Nevada. I won't ask you to come with me now, but will you be ready to come when I am here again?`),
  D('Lucy',`Khi nào anh về?`,`And when will that be?`),
  D('Jefferson Hope',`Nhiều nhất là hai tháng. Rồi anh sẽ đến đón em. Không ai có thể ngăn cách chúng ta.`,`A couple of months at the outside. I will come and claim you then, my darling. There's no one who can stand between us.`),
  D('Lucy',`Còn cha em thì sao?`,`And how about father?`),
  D('Jefferson Hope',`Ông ấy đã đồng ý, miễn là mỏ bạc làm ăn được. Anh không lo chuyện đó.`,`He has given his consent, provided we get these mines working all right. I have no fear on that head.`),
  D(NARR,`Anh nhảy lên ngựa, phi nước đại đi mất, không ngoảnh lại lần nào, như sợ rằng chỉ cần nhìn lại một lần thôi là sẽ không nỡ đi nữa.`,`He flung himself upon his horse and galloped furiously away, never even looking round, as though afraid that his resolution might fail him if he took one glance at what he was leaving.`)];
const PROPHET0=[D(NARR,`Ba tuần sau ngày Jefferson Hope ra đi, một buổi sáng, John Ferrier nhìn qua cửa sổ và thấy một người đàn ông vạm vỡ, tóc màu hung đang đi lên lối vào. Tim ông như chùng xuống. Đó là Brigham Young, nhà tiên tri vĩ đại.`,`Three weeks after Jefferson Hope left, John Ferrier looked out of his window one morning and saw a stout, sandy-haired, middle-aged man coming up the pathway. His heart leapt to his mouth. It was none other than the great Brigham Young himself.`)];
const PROPHET1=[D(YOUNG,`Anh Ferrier, những tín đồ chân chính đã là bạn tốt của anh. Chúng tôi nhặt anh lên khi anh sắp chết đói giữa sa mạc, chia bánh mì cho anh, cho anh một mảnh đất tốt. Đổi lại, chúng tôi chỉ đặt một điều kiện: anh phải sống theo đức tin của chúng tôi.`,`Brother Ferrier, the true believers have been good friends to you. We picked you up when you were starving in the desert, we shared our food with you, and gave you a goodly share of land. In return we asked but one condition: that you should embrace the true faith, and conform in every way to its usages.`),
  D('Ferrier',`Tôi đã làm gì sai chứ?`,`And where have I neglected?`),
  D(YOUNG,`Người ta đồn rằng Lucy, con gái anh, đã hứa hôn với một kẻ ngoại đạo. Stangerson có một đứa con trai, Drebber cũng có một đứa con trai. Đứa nào cũng sẵn lòng rước con gái anh về. Hãy để cô ấy chọn một trong hai. Cô ấy còn trẻ; chúng tôi cho cô ấy một tháng để quyết định.`,`It is reported that your daughter Lucy has been sealed to some Gentile. Stangerson has a son, and Drebber has a son, and either of them would gladly welcome your daughter to his house. Let her choose between them. She is young; we shall give her a month to choose.`),
  D(YOUNG,`(dừng lại ở cửa, mặt đỏ bừng, mắt long lên) Thà rằng anh và con bé nằm trơ xương trắng trên dãy Sierra Blanco, còn hơn là dám đem ý chí yếu ớt của mình chống lại mệnh lệnh của Hội đồng Bốn vị Thánh!`,`(pausing at the door, his face flushed and his eyes flashing) It were better for you, John Ferrier, that you and she were now lying blanched skeletons upon the Sierra Blanco, than that you should put your weak wills against the orders of the Holy Four!`)];
const PROPHET2=[D('Lucy',`(bước vào, mặt tái nhợt) Con không thể không nghe thấy. Cha ơi, mình phải làm sao đây?`,`(coming in, white-faced) I could not help it. His voice rang through the house. Oh, father, father, what shall we do?`),
  D('Ferrier',`Đừng sợ, con. (kéo con vào lòng, xoa mái tóc vàng) Mình sẽ tìm được cách. Con vẫn không đổi lòng với chàng trai ấy chứ? Cha sẽ nhắn cho Jefferson Hope. Cậu ấy sẽ quay về nhanh như gió.`,`Don't you scare yourself. (drawing her to him and passing his broad, rough hand over her chestnut hair) We'll fix it up somehow. You don't find your fancy kind o\' lessening for this chap, do you? I'll send a message to Jefferson Hope. He'll be back here with a speed that would whip electro-telegraphs.`)];
const SUITORS=[D(DREBJ,`(ngồi vắt chân trên ghế của Ferrier như ở nhà mình) Có lẽ ông chưa biết chúng tôi. Đây là con trai Trưởng lão Drebber, còn tôi là Joseph Stangerson... à không, ngược lại. Chúng tôi đến để hỏi cưới con gái ông.`,`(with his legs cocked up on Ferrier\'s stove) Maybe you don\'t know us. This here is the son of Elder Drebber, and I\'m Joseph Stangerson... or the other way round. We have come to ask for your daughter\'s hand.`),
  D(STANJ,`Tôi có bốn vợ, còn anh Drebber đây có bảy. Nhưng tôi thấy tôi xứng hơn.`,`I have four wives, and Brother Drebber here has seven. It appears to me that my claim is the stronger one.`),
  D(DREBJ,`Không, không, anh Stangerson. Vấn đề không phải ta có bao nhiêu vợ, mà là ta nuôi nổi bao nhiêu. Cha tôi đã giao cho tôi xưởng xay, nên tôi giàu hơn.`,`Nay, nay, Brother Stangerson. The question is not how many wives we have, but how many we can keep. My father has now given over his mills to me, and I am the richer man.`)];
const THROW=[{q:{vi:'Ferrier đứng ở cửa, nghe hai gã thanh niên tranh nhau như đang mua một con ngựa. Ông làm gì?',en:'Ferrier stands in the doorway listening to the two young men squabble as if over a horse. What does he do?'},
  o:[{vi:'Mời họ ở lại uống trà',en:'Invite them to stay for tea'},{vi:'Bước tới, chỉ ra cửa và đuổi cả hai đi',en:'Stride forward, point to the door and throw them both out'}],a:1,
  r:{vi:'“Nghe đây. Khi nào con gái tôi gọi thì các anh hãy đến. Còn từ giờ tới lúc ấy, tôi không muốn thấy mặt các anh nữa.” Hai gã tháo chạy ra cửa, còn Ferrier đuổi theo tận cổng.',en:'"Look here. When my daughter summons you, you can come; but until then I don\'t want to see your faces again." The two young men fled, Ferrier following them to the gate.'}}];
const COUNTDOWN=[D(NARR,`Sáng hôm sau, John Ferrier thức dậy và thấy một mảnh giấy được ghim vào chăn, ngay trên ngực ông. Không ai biết kẻ nào đã vào nhà lúc nửa đêm. Hãy đi xem quanh nhà.`,`Next morning John Ferrier woke to find a paper pinned to the coverlet of his bed, right over his chest. No one knew who had entered the house in the night. Look around the house.`)];
const COUNTEND=[D(NARR,`Ngày qua ngày, những con số tiếp tục xuất hiện: trên tường, trên sàn, có hôm trên những tấm biển dán ở cổng vườn. Ông không biết những người canh gác vô hình ấy là ai. Mỗi sáng, ông lại thấy con số giảm đi một.`,`Day by day the numbers went on appearing: on the walls, on the floor, once on small placards stuck on the garden gate. He could not discover the unseen watchers. Each morning the number was one fewer.`),
  D('Ferrier',`Hai mươi tám... hai mươi bảy... Rồi chỉ còn năm ngày. Rồi bốn. Rồi ba. Mà Jefferson Hope vẫn chưa thấy đâu.`,`Twenty-eight... twenty-seven... Then only five days. Then four. Then three. And still no sign of Jefferson Hope.`),
  D(NARR,`Một buổi sáng, con số 2 hiện trên tường. Đó là ngày cuối cùng ông còn được tự do. Đêm ấy, ông ngồi một mình nghĩ ngợi, thì nghe một tiếng sột soạt khe khẽ ngoài cửa...`,`One morning the figure 2 appeared upon the wall. It was the last day of his liberty. That night, as he sat alone brooding, he heard a gentle scratching at the door...`)];
const FLIGHT0=[D(NARR,`Ferrier mở cửa. Một người đàn ông bò sát mặt đất như con rắn, lách vào nhà rồi đứng dậy đóng cửa lại. Đó là Jefferson Hope, mặt hốc hác, mắt sáng quắc.`,`Ferrier opened the door. A man crawled in like a serpent, then sprang to his feet and closed the door. It was Jefferson Hope, his face haggard, his eyes wild.`),
  D('Jefferson Hope',`Cho tôi chút gì ăn. Hai ngày nay tôi chưa có gì vào bụng. Nhà ông bị canh cả trước lẫn sau. Tôi phải bò qua cánh đồng lúa mì mới vào được.`,`Give me food. I have had no time for bite or sup for eight-and-forty hours. The house is watched on every side. I had to crawl through the wheat to get in.`),
  D('Jefferson Hope',`Đêm nay chúng ta phải đi. Đi qua cánh đồng lúa mì, lúa sẽ che cho ta. Đừng bước ra chỗ trống khi có người canh ở gần. Ngựa của tôi đợi ở hẻm núi Eagle, phía trên kia.`,`We must go tonight. Through the wheat: it will hide us. Don't step into the open while a watcher is near. My horses are waiting in the Eagle Ravine, up above.`)];
const OVERHEAR=[D(WATCH,`Đêm mai, lúc nửa đêm, khi chim đớp muỗi kêu ba tiếng.`,`Tomorrow at midnight, when the whip-poor-will calls three times.`),
  D(WATCH2,`Được. Tôi có báo cho anh Drebber không?`,`It is well. Shall I tell Brother Drebber?`),
  D(WATCH,`Báo cho anh ấy, rồi để anh ấy báo cho những người khác. Chín đến bảy!`,`Pass it on to him, and from him to the others. Nine to seven!`),
  D(WATCH2,`Bảy đến năm!`,`Seven to five!`),
  D('Jefferson Hope',`(thì thầm) Mật khẩu. Nhớ lấy.`,`(whispering) A password. Remember it.`)];
const SENTRY=[D(SENT,`(trên mỏm đá, giơ súng lên) Ai đó?`,`(on a rock above, raising his gun) Who goes there?`),
  D('Jefferson Hope',`Lữ khách đi Nevada.`,`Travellers for Nevada.`),
  D(SENT,`Được ai cho phép?`,`By whose permission?`),
  D('Jefferson Hope',`Hội đồng Bốn vị Thánh.`,`The Holy Four.`)];
const QUIZ13=[{q:{vi:'Lính gác hô: “Chín từ bảy!” Bạn đáp thế nào?',en:'The sentinel cries: "Nine from seven!" What do you answer?'},o:[{vi:'“Chín từ bảy!”',en:'"Nine from seven!"'},{vi:'“Bảy từ năm!”',en:'"Seven from five!"'},{vi:'“Lữ khách đi Nevada!”',en:'"Travellers for Nevada!"'}],a:1,
  r:{vi:'“Qua đi, và cầu Chúa đi cùng các người.” Họ vượt qua chốt gác cuối cùng. Phía trước là con đường tự do.',en:'"Pass, and the Lord go with you." They passed the last outpost. Before them lay the road to freedom.'}}];
const ANG0=[D(NARR,`Hai ngày sau, đồ ăn cạn. Jefferson Hope để Ferrier và Lucy ở lại bên đống lửa trong hẻm núi, mang súng đi săn. Anh hạ được một con cừu núi, nhưng khi quay về thì trời đã tối, và anh lạc đường mất mấy giờ.`,`Two days later their food ran out. Jefferson Hope left Ferrier and Lucy by the fire in the ravine and went hunting. He shot a bighorn sheep, but by the time he turned back night had fallen, and he lost his way for hours.`)];
const COWPERT=[D(COWPER,`(giật mình) Jefferson Hope! Anh điên rồi sao mà quay lại đây? Đầu anh đang bị treo giá đấy.`,`(starting) Jefferson Hope! You are mad to come here. Your very life is forfeit.`),
  D('Jefferson Hope',`Cowper, nói tôi nghe, Lucy Ferrier đâu? Ông Ferrier...`,`Cowper, where is Lucy Ferrier? And John Ferrier...`),
  D(COWPER,`Ông Ferrier đã chết. Còn cô Lucy... hôm qua cô ấy đã bị gả cho Drebber con. Cô ấy chẳng còn sức sống nào, giống như một hồn ma hơn là người. Đám cưới chỉ là hình thức. Tôi nghe nói cô ấy sẽ không sống được lâu đâu.`,`John Ferrier is dead. And Lucy... she was married yesterday to young Drebber. She has no life left in her. She is more like a ghost than a woman. I don't think she will last long.`)];
const WAKE0=[D(NARR,`Chưa đầy một tháng sau, Lucy qua đời. Đêm trước đám tang, những người phụ nữ ngồi canh quanh quan tài thì cửa bật mở. Một người đàn ông hốc hác, áo quần tả tơi bước vào, không nhìn ai, đi thẳng tới bên thi thể trắng lạnh của Lucy.`,`Within a month Lucy was dead. On the night before the burial, as the women sat watching by the coffin, the door was flung open, and a savage-looking, weather-beaten man in tattered garments strode in, without a glance at anyone, to the white, silent figure of Lucy Ferrier.`)];
const WAKE1=[D(NARR,`Anh cúi xuống, thành kính hôn lên vầng trán lạnh của cô. Rồi anh cầm lấy bàn tay cô, tháo chiếc nhẫn cưới khỏi ngón tay.`,`Stooping over her, he pressed his lips reverently to her cold forehead. Then, snatching up her hand, he took the wedding ring from her finger.`),
  D('Jefferson Hope',`Cô ấy sẽ không bị chôn cùng với thứ này.`,`She shall not be buried in that.`),
  D(NARR,`Trước khi mọi người kịp kêu lên, anh đã lao xuống cầu thang và biến mất. Từ đêm đó, anh chỉ còn sống vì một mục đích duy nhất: trả thù.`,`Before an alarm could be raised he sprang down the stairs and was gone. From that night he lived for one purpose alone: revenge.`)];
const ANGEND=[D(NARR,`Nhiều năm trôi qua. Drebber và Stangerson rời Utah, sang Ohio. Jefferson Hope lần theo họ: tới Cleveland, rồi St. Petersburg, Paris, Copenhagen, và cuối cùng là London. Ở đó, anh làm nghề đánh xe ngựa thuê. Phần còn lại, chúng ta hãy nghe chính anh kể, theo hồi ký của bác sĩ Watson.`,`Years passed. Drebber and Stangerson left Utah for Ohio. Jefferson Hope followed: to Cleveland, then St. Petersburg, Paris, Copenhagen, and at last London, where he became a cabman. For the rest we must turn to Dr. Watson\'s journal, and hear it from his own lips.`)];
const YARD0=[D(INSP,`(ghi vào sổ) Tù nhân Jefferson Hope, bị buộc tội giết Enoch J. Drebber và Joseph Stangerson. Tôi phải nhắc anh rằng những gì anh nói sẽ được ghi lại và có thể dùng để chống lại anh.`,`(writing) Prisoner Jefferson Hope, charged with the murder of Enoch J. Drebber and Joseph Stangerson. I must warn you that what you say will be taken down and may be used against you.`),
  D('Jefferson Hope',`Tôi có nhiều điều muốn nói. Có thể tôi sẽ không bao giờ ra tòa. (quay sang tôi) Ông có phải bác sĩ không? Đặt tay lên ngực tôi đây.`,`I've got a good deal to say. I may never be tried. (turning to me) Are you a doctor? Put your hand here.`)];
const HEART15={ t:{vi:'Trái tim của Jefferson Hope',en:'Jefferson Hope\'s heart'}, d:{vi:'Tôi đặt tay lên ngực hắn. Bên trong, mọi thứ rung lên, thình thịch như một cỗ máy yếu ớt sắp vỡ. Phình động mạch chủ: túi phình có thể vỡ bất cứ lúc nào.',en:'I placed my hand upon his chest. There appeared to be a most extraordinary throbbing and commotion going on inside, as if some feeble building were rocking. An aortic aneurism, which might burst at any moment.'}, by:'Watson', h:{vi:'Tôi có lẽ sẽ không sống được đến phiên tòa. Tôi muốn kể hết mọi chuyện.',en:'I may not live to be tried. I want to tell my story.'} };
const HQS=[
 {id:'why',needs:[],q:{vi:'Vì sao anh căm thù hai người đó?',en:'Why did you hate those two men?'},lines:[D('Jefferson Hope',`Họ đã gây ra cái chết của hai con người: một người cha và cô con gái. Vì thế họ đã mất quyền được sống. Không tòa án nào xử được họ, nên tôi tự mình làm thẩm phán, bồi thẩm và đao phủ.`,`They were guilty of the death of two human beings, a father and a daughter, and they had, therefore, forfeited their own lives. No court would convict them, so I determined that I should be judge, jury, and executioner all rolled into one.`)]},
 {id:'ring',needs:['why'],q:{vi:'Còn chiếc nhẫn?',en:'And the ring?'},lines:[D('Jefferson Hope',`Cô gái ấy lẽ ra đã cưới tôi từ hai mươi năm trước. Tôi tháo chiếc nhẫn khỏi ngón tay cô khi cô đã chết, và thề rằng đôi mắt hấp hối của hắn sẽ phải nhìn vào chính chiếc nhẫn ấy. Tôi mang nó theo, đuổi theo hắn qua hai lục địa.`,`That girl was to have married me twenty years ago. I took the marriage ring from her dead finger, and I vowed that his dying eyes should rest upon that very ring. I have carried it about with me, and have followed him over two continents until I caught him.`)]},
 {id:'cab',needs:['why'],q:{vi:'Vì sao anh làm nghề đánh xe?',en:'Why did you become a cabman?'},lines:[D('Jefferson Hope',`Tới London thì túi tôi gần như rỗng. Đánh xe và cưỡi ngựa thì tôi quen như đi bộ, nên tôi xin làm xà ích. Khó nhất là học đường sá, nhưng tôi có bản đồ. Rồi tôi tìm ra nhà trọ của họ ở Camberwell, và cứ thế lặng lẽ theo dõi.`,`When I got to London my pocket was about empty. Driving and riding are as natural to me as walking, so I applied at a cab-owner\'s office. The hardest job was to learn my way about, but I had a map. Then I found their boarding-house at Camberwell, and I dogged them.`)]},
 {id:'night',needs:['cab'],q:{vi:'Kể về đêm Drebber chết.',en:'Tell us about the night Drebber died.'},lines:[D('Jefferson Hope',`Đêm ấy Drebber say khướt, tự gọi xe của tôi. Tôi chở hắn tới căn nhà bỏ trống ở Brixton, căn nhà mà tôi có chìa khóa. Tôi thắp nến, soi vào mặt mình và hỏi: “Enoch Drebber, giờ thì ông có nhận ra tôi không?” Hắn run lẩy bẩy, răng va lập cập.`,`That night Drebber was drunk and hailed my cab himself. I drove him to the empty house in the Brixton Road, which I had a key to. I lit a candle and held it to my own face: "Now, Enoch Drebber, who am I?" He shrank back, his teeth chattering.`)]},
 {id:'pills',needs:['night'],q:{vi:'Hai viên thuốc là gì?',en:'What were the two pills?'},lines:[D('Jefferson Hope',`Ở Mỹ tôi từng làm lao công trong phòng thí nghiệm của một trường đại học. Ông giáo sư cho sinh viên xem một chất độc lấy từ tên độc Nam Mỹ. Tôi lấy trộm một ít, làm thành thuốc viên. Mỗi hộp hai viên: một viên có độc, một viên vô hại. Tôi để hắn chọn, viên còn lại tôi uống. Hãy để Chúa trên cao phân xử giữa chúng tôi.`,`I was once janitor of a laboratory in a college. The professor showed his students an alkaloid extracted from some South American arrow poison. I took a little and made pills, two in each box: one poisoned, one harmless. He would choose, and I would take what he left. Let the high God judge between us.`),
  D('Jefferson Hope',`Hắn chọn, nuốt viên thuốc, và tôi uống viên kia. Rồi tôi giơ chiếc nhẫn trước mắt hắn. Chỉ một lát sau, hắn ngã xuống. Tôi lật người hắn lên. Hắn đã chết.`,`He chose and swallowed, and I took the other. Then I held the ring before his eyes. In a moment he fell. I turned him over. He was dead.`)]},
 {id:'rache',needs:['pills'],q:{vi:'Còn chữ RACHE trên tường?',en:'And RACHE on the wall?'},lines:[D('Jefferson Hope',`Máu mũi tôi chảy ròng ròng vì xúc động. Tôi chợt nghĩ ra trò viết lên tường để đánh lừa cảnh sát. Tôi nhớ có lần ở New York người ta tìm thấy một xác người Đức với chữ RACHE viết phía trên.`,`The blood had been streaming from my nose. I took it into my head to write upon the wall with it, to put the police upon a wrong track. I remembered a German being found in New York with RACHE written up above him.`)]},
 {id:'back',needs:['rache'],q:{vi:'Vì sao anh quay lại căn nhà?',en:'Why did you go back to the house?'},lines:[D('Jefferson Hope',`Đi được một đoạn thì tôi thấy mất chiếc nhẫn, kỷ vật duy nhất còn lại của cô ấy. Tôi quay lại, và đâm sầm vào một viên cảnh sát vừa bước ra. Tôi đành giả làm một gã say bí tỉ.`,`I found the ring was gone, the only memento I had of her. I drove back, and walked right into the arms of a police officer coming out. I had to pretend to be hopelessly drunk.`)]},
 {id:'stang',needs:['back'],q:{vi:'Còn Stangerson?',en:'And Stangerson?'},lines:[D('Jefferson Hope',`Tôi leo thang vào phòng hắn lúc rạng sáng, đưa hắn hộp thuốc như với Drebber. Nhưng thay vì chọn, hắn nhảy khỏi giường bóp cổ tôi. Để tự vệ, tôi đâm vào tim hắn. Đằng nào cũng vậy thôi: Chúa sẽ không để bàn tay tội lỗi của hắn chọn được viên vô hại.`,`I climbed the ladder into his room at dawn and offered him the pills, as with Drebber. Instead of choosing, he sprang from his bed and flew at my throat. In self-defence I stabbed him to the heart. It would have been the same in any case; Providence would never have allowed his guilty hand to pick out anything but the poison.`)]},
 {id:'friend',needs:['back'],q:{vi:'Ai là “bà lão” đến nhận nhẫn?',en:'Who was the "old woman" who came for the ring?'},lines:[D('Jefferson Hope',`Một người bạn của tôi nhận đi. Tôi có thể kể bí mật của mình, nhưng không kéo người khác vào rắc rối.`,`A friend of mine volunteered to go. I can tell my own secrets, but I don\'t get other people into trouble.`),D('Holmes',`(gật đầu) Tôi hiểu. Và tôi phải công nhận: anh bạn ấy diễn rất giỏi.`,`(nodding) I understand. And I must admit your friend is a capital actor.`)]}
];
const YARDEND=[D('Jefferson Hope',`Các ông có thể coi tôi là kẻ sát nhân, nhưng tôi cho rằng tôi cũng là một người thực thi công lý, chẳng khác gì các ông.`,`You may consider me a murderer; but I hold that I am just as much an officer of justice as you are.`),
  D(INSP,`(khép sổ) Phiên tòa sẽ mở vào thứ Năm. Các ông sẽ được mời ra làm chứng.`,`(closing his book) The trial will be on Thursday. You will be called as witnesses.`)];
const END0=[D(NARR,`Nhưng phiên tòa ấy không bao giờ diễn ra. Ngay đêm bị bắt, túi phình trong ngực Jefferson Hope vỡ. Sáng hôm sau, người ta thấy anh nằm trên sàn phòng giam, với một nụ cười thanh thản trên môi, như thể lúc lâm chung anh đã được nhìn lại cả một đời mình và thấy rằng việc mình làm là trọn vẹn.`,`But that trial never came. On the very night of his capture the aneurism burst, and he was found in the morning stretched upon the floor of his cell, with a placid smile upon his face, as though he had been able in his dying moments to look back upon a useful life, and on work well done.`),
  D('Holmes',`Gregson và Lestrade sẽ phát điên vì cái chết ấy. Bao nhiêu công sức quảng cáo của họ đổ sông đổ biển. (cười) Nhưng anh muốn biết tôi đã suy luận ra sao, phải không, Watson?`,`Gregson and Lestrade will be wild about his death. Where will their grand advertisement be now? (laughing) But you want to know how I reasoned it out, don\'t you, Watson?`),
  D('Holmes',`Bí quyết là suy luận ngược. Người ta kể một chuỗi sự kiện thì ai cũng đoán được kết quả. Nhưng ít ai, khi biết kết quả, có thể lần ngược ra từng bước dẫn tới nó. Thử xem anh lần ngược được không nhé.`,`The grand thing is to be able to reason backwards. Most people, if you describe a train of events to them, will tell you what the result would be. There are few people who, if you told them a result, would be able to evolve what the steps were which led up to that result. Let us see if you can.`)];
const QUIZ16=[
 {q:{vi:'Bước 1: Những vết bánh xe hẹp trước cổng Lauriston Gardens nói lên điều gì?',en:'Step 1: What did the narrow wheel-tracks at the gate of Lauriston Gardens tell Holmes?'},o:[{vi:'Một chiếc xe ngựa riêng sang trọng',en:'A smart private carriage'},{vi:'Một chiếc xe ngựa thuê, đến trong đêm (đêm qua có mưa)',en:'A hired cab, there in the night (it had rained that night)'},{vi:'Một chiếc xe chở hàng',en:'A delivery cart'}],a:1,r:{vi:'Bánh xe hẹp hơn xe riêng: đó là xe thuê. Mưa chỉ dứt vào nửa đêm, nên xe đến trong đêm.',en:'The gauge was narrower than a private carriage: a cab. It had rained until the night, so it came in the night.'}},
 {q:{vi:'Bước 2: Làm sao Holmes biết hung thủ cao hơn sáu foot?',en:'Step 2: How did Holmes know the murderer was over six feet tall?'},o:[{vi:'Từ độ dài sải chân, và chữ RACHE viết cao trên tường',en:'From the length of his stride, and RACHE written high on the wall'},{vi:'Rance nói vậy',en:'Rance said so'},{vi:'Từ cái mũ',en:'From the hat'}],a:0,r:{vi:'Chiều cao của một người, trong chín trường hợp trên mười, có thể đoán từ sải chân. Và người ta viết theo bản năng ở ngang tầm mắt.',en:'The height of a man, in nine cases out of ten, can be told from the length of his stride. And a man writes instinctively about the level of his own eyes.'}},
 {q:{vi:'Bước 3: Vì sao Holmes loại bỏ giả thuyết cướp của hay chính trị?',en:'Step 3: Why did Holmes rule out robbery or politics?'},o:[{vi:'Vì không mất thứ gì, kẻ giết người thong thả ở lại, và có chiếc nhẫn cưới phụ nữ: đây là chuyện riêng, vì một người đàn bà',en:'Nothing was taken, the murderer took his time, and there was a woman\'s wedding ring: it was private, about a woman'},{vi:'Vì Gregson bảo vậy',en:'Because Gregson said so'},{vi:'Vì nạn nhân là người Mỹ',en:'Because the victim was American'}],a:0,r:{vi:'Kẻ ám sát chính trị làm xong là chạy. Kẻ này ở lại, để dấu vết khắp phòng. Chữ RACHE chỉ là mồi nhử.',en:'Political assassins do their work and fly. This man remained, leaving his traces all over the room. RACHE was a blind.'}},
 {q:{vi:'Bước 4: Holmes tìm ra cái tên Jefferson Hope bằng cách nào?',en:'Step 4: How did Holmes get the name Jefferson Hope?'},o:[{vi:'Đánh điện hỏi cảnh sát Cleveland: Drebber từng xin được bảo vệ khỏi một tình địch cũ tên Jefferson Hope',en:'He wired the Cleveland police: Drebber had once asked for protection against an old rival called Jefferson Hope'},{vi:'Bà lão nói ra',en:'The old woman told him'},{vi:'Đọc trên báo',en:'He read it in the paper'}],a:0,r:{vi:'Còn lại chỉ là tìm hắn. Một người đánh xe ngựa thì làm gì có chỗ nào tốt hơn để ẩn giữa London? Tôi cho đội trẻ phố Baker đi hỏi mọi bãi xe, và Wiggins đã tìm ra hắn.',en:'It only remained to find him. Where better for a man to hide in London than behind the reins of a cab? I sent my street Arabs to every cab-proprietor, and Wiggins found him.'}}
];
const ECHO={ t:{vi:'Báo Echo',en:'The Echo'}, d:{vi:'“...Bí mật rằng vụ án được làm sáng tỏ là công lao của các thanh tra Lestrade và Gregson, hai sĩ quan nổi tiếng của Scotland Yard. Kẻ sát nhân bị bắt tại phòng của một ông Sherlock Holmes nào đó, một tay nghiệp dư cũng có chút năng khiếu, người hẳn sẽ học hỏi được nhiều từ những người thầy như vậy...”',en:'"...It is an open secret that the credit of this smart capture belongs entirely to the well-known Scotland Yard officials, Messrs. Lestrade and Gregson. The man was apprehended in the rooms of a certain Mr. Sherlock Holmes, who has himself, as an amateur, shown some talent in the detective line, and who, with such instructors, may hope in time to attain to some degree of their skill..."'}, by:'Watson', h:{vi:'Tôi đã nói với anh từ đầu rồi mà! Đó là kết quả của Cuộc điều tra màu đỏ của chúng ta: kiếm được cho họ một tấm huy chương!',en:'Didn\'t I tell you so when we started? That\'s the result of all our Study in Scarlet: to get them a testimonial!'} };
const END1=[D('Watson',`Đừng bận tâm. Tôi đã ghi lại toàn bộ sự việc trong sổ, và công chúng sẽ được biết sự thật.`,`Never mind. I have all the facts in my journal, and the public shall know them.`),
  D('Holmes',`(mỉm cười) Thôi thì anh cứ tự hài lòng như gã keo kiệt thành La Mã: “Thiên hạ chê bai ta, nhưng ta tự vỗ tay khen mình ở nhà, khi ngắm những đồng tiền trong rương.”`,`(smiling) In the meantime you must make yourself contented by consciousness of success, like the Roman miser: "Populus me sibilat, at mihi plaudo / Ipse domi simul ac nummos contemplor in arca."`)];

  n29:{t:{vi:'Mảnh giấy trên chăn',en:'The paper on the coverlet'},d:{vi:'Trên mảnh giấy, nét chữ to và nguệch ngoạc: “Ông được cho hai mươi chín ngày để sửa đổi, và rồi...”',en:'On it, in bold straggling letters: "Twenty-nine days are given you for amendment, and then—"'},by:'Ferrier'},

  plain:{vi:'Năm 1847, John Ferrier và bé Lucy, hai người sống sót cuối cùng của một đoàn người, được một đoàn người Mormon cứu giữa sa mạc, với điều kiện Ferrier phải theo đức tin của họ.',en:'In 1847 John Ferrier and little Lucy, last survivors of a party, were rescued in the desert by a Mormon caravan, on condition that Ferrier adopt their faith.'},

  prophet:{vi:'Brigham Young ra lệnh: Lucy phải cưới con trai Drebber hoặc Stangerson trong vòng một tháng. Ferrier đuổi hai gã thanh niên đi. Mỗi sáng, một con số đếm ngược lại xuất hiện trong nhà.',en:'Brigham Young ordered that Lucy marry the son of Drebber or Stangerson within a month. Ferrier threw the two young men out. Each morning a countdown number appeared in the house.'},
  flight:{vi:'Jefferson Hope trở về đúng đêm cuối cùng, dẫn hai cha con trốn qua cánh đồng lúa mì. Nhờ nghe lén được mật khẩu “Chín đến bảy, bảy đến năm”, họ vượt qua chốt gác cuối cùng.',en:'Jefferson Hope returned on the last night and led father and daughter out through the wheat. Having overheard the password, "Nine to seven, seven to five", they passed the last sentinel.'},
  angels:{vi:'Khi Hope đi săn, kẻ thù ập tới: Ferrier bị giết, Lucy bị bắt về gả cho Drebber và chết chưa đầy một tháng sau. Hope tháo chiếc nhẫn cưới khỏi tay cô và thề trả thù.',en:'While Hope was hunting, the enemy struck: Ferrier was killed, Lucy was taken and married to Drebber, and died within a month. Hope took the wedding ring from her finger and swore revenge.'},
  yard:{vi:'Ở Scotland Yard, Jefferson Hope kể lại tất cả: nghề đánh xe, hai viên thuốc để “Chúa phân xử”, chữ RACHE viết bằng máu mũi, chiếc nhẫn đánh rơi. Anh mắc chứng phình động mạch chủ, không còn sống được bao lâu.',en:'At Scotland Yard, Jefferson Hope told everything: the cab, the two pills to let "God judge", RACHE written in his own nose-blood, the lost ring. He had an aortic aneurism and had little time left.'},

.tli .vt{font-size:13.5px;color:#b9ad96;font-style:italic}
.tli .prg{font-size:13px;color:#d9cfbb;margin-top:6px}
.tli .bar{height:4px;background:#3a332a;border-radius:2px;margin:6px 0;overflow:hidden}.tli .bar i{display:block;height:100%;background:var(--gas)}

.story{display:flex;gap:8px;align-items:center;font-size:13px;color:#cfc4ae;padding:5px 6px;border:1px dashed #3a332a;border-radius:3px;min-width:0}
.story .em{font-size:20px;width:26px;text-align:center;flex:0 0 auto;filter:grayscale(.4)}
.story span{overflow:hidden;text-overflow:ellipsis}

#menuBtn{display:none}

  .tools.open [data-lang],.tools.open .bright{display:flex}

function ambNodes(){ if(!actx) return AN; if(AN&&AN.ctx===actx) return AN; const sr=actx.sampleRate, buf=actx.createBuffer(1,sr*2,sr), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const master=actx.createGain(); master.connect(actx.destination);
  const loop=(type,f,q)=>{ const s=actx.createBufferSource(); s.buffer=buf; s.loop=true; const fl=actx.createBiquadFilter(); fl.type=type; fl.frequency.value=f; if(q) fl.Q.value=q; const gn=actx.createGain(); gn.gain.value=0; s.connect(fl).connect(gn).connect(master); s.start(); return gn; };
  const wind=loop('bandpass',420,.6), murmur=loop('bandpass',520,1.2), fireL=loop('lowpass',180), rumble=loop('lowpass',120);
  const lfo=actx.createOscillator(), lg=actx.createGain(); lfo.frequency.value=.08; lg.gain.value=.5; lfo.connect(lg); const wmod=actx.createGain(); wmod.gain.value=1; lg.connect(wmod.gain); lfo.start();
  const hum=actx.createOscillator(); hum.frequency.value=60; const hg=actx.createGain(); hg.gain.value=0; hum.connect(hg).connect(master); hum.start();
  AN={ctx:actx,buf,master,wind,murmur,fireL,rumble,hg}; return AN; }
function burst(t,dur,type,f,vol){ const s=actx.createBufferSource(); s.buffer=AN.buf; const fl=actx.createBiquadFilter(); fl.type=type; fl.frequency.value=f; const gn=actx.createGain(); gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(fl).connect(gn).connect(AN.master); s.start(t,Math.random()); s.stop(t+dur+.05); }
function tone(t,f,dur,vol,type,f2){ const o=actx.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); const gn=actx.createGain(); gn.gain.setValueAtTime(.0001,t); gn.gain.linearRampToValueAtTime(vol,t+Math.min(.03,dur/4)); gn.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(gn).connect(AN.master); o.start(t); o.stop(t+dur+.05); }
const midi=n=>440*Math.pow(2,(n-69)/12);
const PROG=[[50,57,62,66],[47,55,59,62],[43,55,59,62],[45,54,57,61]]; let musT=0, musI=0, clockT=0, hoofT=0;
function applyAmb(){ if(rainGain) rainGain.gain.value=0; if(!actx) return; ambNodes(); const id=(S.mode==='title'||!W)?null:W.id; ambCur=AMB[id]||{}; const on=S.sound&&id?1:0, now=actx.currentTime;
  AN.master.gain.setTargetAtTime(on,now,.3);
  if(rainGain) rainGain.gain.setTargetAtTime(on*(ambCur.rain||0),now,.4);
  AN.wind.gain.setTargetAtTime(ambCur.wind||0,now,.6); AN.murmur.gain.setTargetAtTime(ambCur.murmur||0,now,.6); AN.fireL.gain.setTargetAtTime(ambCur.fire?.05:0,now,.6); AN.rumble.gain.setTargetAtTime(ambCur.hooves?.08:0,now,.6); AN.hg.gain.setTargetAtTime(ambCur.hum||0,now,.6); }
setInterval(()=>{ if(!actx||!AN||!S.sound||S.mode==='title') return; const t=actx.currentTime, a=ambCur;
  if(a.fire){ if(Math.random()<.35) burst(t+Math.random()*.1,.03+Math.random()*.05,'highpass',1800+Math.random()*2000,.05+Math.random()*.08); }
  if(a.clock){ if(t>clockT){ clockT=Math.max(t,clockT)+1; const tk=(Math.floor(clockT)%2)?3200:2600; burst(clockT,.025,'bandpass',tk,.05*(a.clock)); } }
  if(a.music){ if(t+.2>musT){ musT=Math.max(t,musT); const ch=PROG[musI%PROG.length]; ch.forEach((n,i)=>tone(musT+i*.18,midi(n),1.6,.022,'triangle')); tone(musT+.9,midi(ch[3]+12),.6,.012,'triangle'); musI++; musT+=1.9; } }
  if(a.bubbles&&Math.random()<.12) tone(t+.05,400+Math.random()*500,.12,.03,'sine',900+Math.random()*700);
  if(a.birds&&Math.random()<.05){ const b=2400+Math.random()*1500; for(let i=0;i<3;i++) tone(t+i*.11,b,.08,.02,'sine',b*1.35); }
  if(a.moo&&Math.random()<.008){ tone(t,140,1.1,.03,'sawtooth',105); }
  if(a.crickets&&Math.random()<.25){ const f=4300+Math.random()*300; for(let i=0;i<4;i++) tone(t+i*.05,f,.03,.008,'sine'); }
  if(a.hooves&&t>hoofT){ hoofT=Math.max(t,hoofT)+.55; burst(hoofT,.04,'bandpass',900,.12); burst(hoofT+.16,.04,'bandpass',750,.1); }
},100);
const _go7=go; go=function(k){ const r=_go7(k); applyAmb(); return r; };
const _st7=showTitle; showTitle=function(){ const r=_st7(); applyAmb(); return r; };
$('soundBtn').onclick=e=>{ S.sound=!S.sound; applyAmb(); refreshHUD(); e.currentTarget.blur(); };
const _sa7=startAudio; startAudio=function(){ if(actx){ if(actx.resume) actx.resume(); applyAmb(); return; } const r=_sa7(); applyAmb(); return r; };
setInterval(()=>{ if(actx&&rainGain&&W&&!(AMB[W.id]||{}).rain&&rainGain.gain.value>0.001) applyAmb(); },1500);
window.__amb=()=>JSON.stringify({id:W&&W.id,rain:rainGain?+rainGain.gain.value.toFixed(3):null,amb:ambCur,master:AN?+AN.master.gain.value.toFixed(2):null});

try{ const sv=parseFloat(localStorage.getItem('sh-px-bright')); if(sv) $('bright').value=sv; }catch(_){}
BR=parseFloat($('bright').value);
$('bright').addEventListener('input',e=>{ BR=parseFloat(e.target.value); try{localStorage.setItem('sh-px-bright',BR)}catch(_){} });
$('bright').addEventListener('keydown',e=>e.stopPropagation());
window.__t={ tp:v=>{ player.x=v[0]; player.y=v[1]; player.dir=v[2]||'d'; }, use:id=>W.use(id), S, go:k=>go(k), w:()=>W, adv:()=>advanceDialog() };
refreshHUD(); renderIntro(); requestAnimationFrame(frame);
})();
